<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITI Attendance System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;--surface:#fff;--surface2:#f8f9fb;
  --border:#e2e6ea;--border2:#cdd3da;
  --text:#1a202c;--text2:#4a5568;--text3:#718096;
  --accent:#2563eb;--accent-bg:#eff6ff;--accent-border:#bfdbfe;
  --success:#16a34a;--success-bg:#f0fdf4;--success-border:#bbf7d0;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-border:#fde68a;
  --danger:#dc2626;--danger-bg:#fef2f2;--danger-border:#fecaca;
  --radius:8px;--radius2:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
h1{font-size:20px;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:14px;font-weight:600}
button{cursor:pointer;font-family:inherit;font-size:13px;transition:all .15s}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font-family:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 10px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border-radius:var(--radius);border:none;font-weight:500}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:var(--surface);border:1px solid var(--border2);color:var(--text2)}.btn-secondary:hover{background:var(--surface2)}
.btn-danger{background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger)}
.btn-success{background:var(--success-bg);border:1px solid var(--success-border);color:var(--success)}
.btn-google{background:#fff;border:1px solid var(--border2);color:var(--text);display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;width:100%;justify-content:center}
.btn-google:hover{background:var(--surface2);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{background:none;border:none;padding:4px 6px;border-radius:4px;color:var(--text3)}.btn-icon:hover{background:var(--surface2);color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);box-shadow:var(--shadow)}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-body{padding:16px 18px}
.flex{display:flex;align-items:center;gap:8px}
.flex-end{justify-content:flex-end}
.flex-between{justify-content:space-between}
.flex-wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.p0{padding:0}
.text-sm{font-size:12px}.text-xs{font-size:11px}
.text-muted{color:var(--text3)}.text-secondary{color:var(--text2)}
.text-danger{color:var(--danger)}.text-warn{color:var(--warn)}.text-success{color:var(--success)}.text-accent{color:var(--accent)}
.fw500{font-weight:500}.fw600{font-weight:600}
table{width:100%;border-collapse:collapse}
th{background:var(--surface2);padding:9px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-accent{background:var(--accent-bg);color:var(--accent)}
/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s}
.sidebar.collapsed{width:48px}
.sidebar.collapsed:not(.mobile-open) .sidebar-logo .title,
.sidebar.collapsed:not(.mobile-open) .sidebar-logo .inst,
.sidebar.collapsed:not(.mobile-open) .sidebar-logo .user{display:none}
.sidebar.collapsed:not(.mobile-open) nav .nav-item span:last-child{display:none}
.sidebar.collapsed:not(.mobile-open) nav .nav-item{justify-content:center;padding:10px 0}
.sidebar.collapsed:not(.mobile-open) .sidebar-footer .btn{font-size:0;padding:8px}
.sidebar-toggle{display:none;background:none;border:none;font-size:24px;cursor:pointer;padding:2px 8px;color:var(--text2);line-height:1;margin-right:6px;border-radius:6px;flex-shrink:0}
.sidebar-toggle:hover{background:var(--surface2)}
@media(max-width:700px){
  .sidebar-toggle{display:block!important}
  .app{position:relative}
  .sidebar{
    width:0!important;
    min-width:0!important;
    overflow:hidden;
    position:fixed;
    height:100vh;
    z-index:50;
    left:0;
    top:0;
    flex-shrink:0;
    transition:width .25s,min-width .25s;
  }
  .sidebar.mobile-open{
    width:240px!important;
    min-width:240px!important;
    box-shadow:4px 0 24px rgba(0,0,0,.25);
  }
  .sidebar.mobile-open .sidebar-logo,
  .sidebar.mobile-open nav,
  .sidebar.mobile-open .sidebar-footer{
    display:flex;
    flex-direction:column;
  }
  .sidebar.mobile-open .nav-item{
    display:flex!important;
    align-items:center;
    gap:9px;
    padding:11px 14px;
    width:100%;
    white-space:nowrap;
  }
  .sidebar.mobile-open .nav-item span{
    display:inline!important;
    font-size:14px;
  }
  .sidebar.mobile-open .sidebar-logo .title,
  .sidebar.mobile-open .sidebar-logo .inst,
  .sidebar.mobile-open .sidebar-logo .user{
    display:block!important;
  }
  .sidebar.mobile-open .sidebar-footer .btn{
    font-size:13px!important;
    padding:8px 16px!important;
  }
  .main{margin-left:0!important;width:100%;min-width:0}
  .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49}
  .mobile-overlay.show{display:block}
  .grid4{grid-template-columns:1fr 1fr!important}
  .content{padding:12px}
}
.sidebar-logo{padding:14px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo .inst{font-size:11px;color:var(--text3);margin-top:1px;line-height:1.3}
.sidebar-logo .user{font-size:12px;color:var(--accent);font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{flex:1;padding:8px 6px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius);border:none;background:none;width:100%;text-align:left;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.nav-sep{height:1px;background:var(--border);margin:6px 4px}
.sidebar-footer{padding:10px 8px;border-top:1px solid var(--border)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:20px}
/* Stat cards */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px}
.stat-val{font-size:26px;font-weight:700;line-height:1.1}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
/* Attendance */
.att-table th,.att-table td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px}
.att-table th{font-size:11px;font-weight:600;color:var(--text2);background:var(--surface2)}
.sess-group{display:flex;gap:3px;align-items:center}
.sess-label{font-size:10px;color:var(--text3);font-weight:600;width:18px}
.sess-btn{padding:4px 7px;border-radius:4px;border:1px solid var(--border2);font-size:11px;font-weight:600;background:var(--surface2);color:var(--text3);cursor:pointer;transition:all .1s;min-width:32px;text-align:center}
.sess-btn.P{background:#dcfce7;color:#15803d;border-color:#86efac}
.sess-btn.A{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.sess-btn.Pe{background:#f3e8ff;color:#7c3aed;border-color:#c4b5fd}
.sess-btn.CL{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.sess-btn.ML{background:#fef3c7;color:#b45309;border-color:#fcd34d}
.att-footer{padding:10px 12px;background:var(--surface2);border-top:1px solid var(--border);display:flex;gap:20px;flex-wrap:wrap;font-size:12px}
/* Login screen */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#eff6ff 0%,#f0fdf4 100%)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.login-logo{font-size:48px;margin-bottom:16px}
/* PIN screen */
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg)}
.pin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:20px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto}
.pin-key{padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-size:18px;font-weight:500;cursor:pointer;text-align:center;transition:all .1s}
.pin-key:hover{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent)}
.pin-key:active{transform:scale(.95)}
/* Profile setup */
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:480px;box-shadow:var(--shadow)}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:18px 20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:400;padding:12px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:slideUp .25s ease}
.toast-success{background:#16a34a;color:#fff}
.toast-error{background:#dc2626;color:#fff}
.toast-info{background:#2563eb;color:#fff}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Loading */
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay p{font-size:13px;color:var(--text2)}
/* Report */
.report-table th,.report-table td{padding:6px 10px;font-size:12px;text-align:center}
.report-table td:nth-child(3){text-align:left}
.report-table th:nth-child(3){text-align:left}
.report-title{padding:14px 18px;background:var(--surface2);border-bottom:1px solid var(--border)}
.pct-critical{color:var(--danger);font-weight:600}
.pct-warn{color:var(--warn);font-weight:600}
.pct-ok{color:var(--success);font-weight:600}
/* User avatar */
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}
.avatar-initials{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--accent-border)}
/* Sync indicator */
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Mobile Attendance Marking */
.att-mobile-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.att-mobile-header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);cursor:pointer;user-select:none}
.att-mobile-sl{font-size:13px;font-weight:700;color:var(--text2);min-width:26px;text-align:center;background:var(--surface2);border-radius:50%;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.att-mobile-adm{font-size:11px;color:var(--text3);min-width:36px}
.att-mobile-name{flex:1;font-weight:600;font-size:14px}
.att-mobile-status{display:flex;gap:4px;align-items:center}
.att-mobile-expand{color:var(--text3);font-size:12px;padding:4px;transition:transform .2s}
.att-mobile-expand.open{transform:rotate(180deg)}
.att-quick-btns{display:flex;gap:6px;flex-wrap:wrap}
.att-quick-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border2);font-size:13px;font-weight:600;cursor:pointer;transition:all .1s;background:var(--surface2);color:var(--text3)}
.att-quick-btn:active{transform:scale(.95)}
.att-quick-btn.P{background:#dcfce7;color:#15803d;border-color:#86efac}
.att-quick-btn.A{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.att-quick-btn.Pe{background:#f3e8ff;color:#7c3aed;border-color:#c4b5fd}
.att-quick-btn.CL{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.att-quick-btn.ML{background:#fef3c7;color:#b45309;border-color:#fcd34d}
/* Split button — same size as original, top half=FN, bottom half=AN */
.split-btn{position:relative;padding:0;border-radius:6px;border:1px solid var(--border2);cursor:pointer;overflow:hidden;display:inline-flex;flex-direction:column;font-size:13px;font-weight:600;min-width:48px;height:36px;flex-shrink:0;transition:transform .1s}
.split-btn .split-top,.split-btn .split-bot{flex:1;width:100%;display:block;cursor:pointer;transition:background .1s}
.split-btn .split-top{border-bottom:1px solid rgba(0,0,0,.1)}
.split-btn .split-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;pointer-events:none;z-index:2}
.split-btn:active{transform:scale(.95)}
.split-top.P{background:#dcfce7}.split-bot.P{background:#dcfce7}
.split-top.A{background:#fee2e2}.split-bot.A{background:#fee2e2}
.split-top.Pe{background:#f3e8ff}.split-bot.Pe{background:#f3e8ff}
.split-top.CL{background:#dbeafe}.split-bot.CL{background:#dbeafe}
.split-top.ML{background:#fef3c7}.split-bot.ML{background:#fef3c7}
.split-top.none,.split-bot.none{background:var(--surface2)}
.split-btn.all-P{border-color:#86efac;color:#15803d}
.split-btn.all-A{border-color:#fca5a5;color:#dc2626}
.split-btn.all-Pe{border-color:#c4b5fd;color:#7c3aed}
.split-btn.all-CL{border-color:#93c5fd;color:#1d4ed8}
.split-btn.all-ML{border-color:#fcd34d;color:#b45309}
.split-btn.mix{border-color:var(--border2);color:var(--text2)}
.att-expand-body{padding:10px 12px;background:var(--surface2);border-top:1px solid var(--border);display:none}
.att-expand-body.open{display:block}
.att-sess-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.att-sess-row:last-child{margin-bottom:0}
.att-sess-lbl{font-size:11px;font-weight:700;color:var(--text2);width:24px}
.att-status-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.att-status-chip.P{background:#dcfce7;color:#15803d;border-color:#86efac}
.att-status-chip.A{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.att-status-chip.Pe{background:#f3e8ff;color:#7c3aed;border-color:#c4b5fd}
.att-status-chip.CL{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.att-status-chip.ML{background:#fef3c7;color:#b45309;border-color:#fcd34d}
/* Attendance Book */
.ab-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius2)}
.ab-table{border-collapse:collapse;font-size:11px;min-width:100%}
.ab-table th,.ab-table td{border:1px solid #ccc;padding:0;text-align:center;white-space:nowrap}
.ab-table th{background:#f0f4f8;font-size:10px;font-weight:700;padding:4px 3px}
.ab-table td{height:32px;min-width:22px;vertical-align:middle;position:relative}
.ab-name{text-align:left!important;padding:0 6px!important;min-width:130px!important;font-weight:500;font-size:12px}
.ab-sl{min-width:28px!important;font-size:11px;color:#6b7280}
.ab-num{min-width:26px!important;font-size:10px;color:#374151}
.ab-stat{min-width:38px!important;font-size:11px;font-weight:600}
/* Day cell marks */
.mark-x{font-weight:900;font-size:15px;color:#111;line-height:1}
.mark-sl{font-weight:900;font-size:14px;color:#111;line-height:1}
.mark-sr{font-weight:900;font-size:14px;color:#111;line-height:1}
.mark-a{font-weight:700;font-size:12px;color:#dc2626}
.mark-asl{font-weight:700;font-size:11px;color:#dc2626}
.mark-asr{font-weight:700;font-size:11px;color:#dc2626}
.mark-pe{font-weight:900;font-size:12px;color:#7c3aed}
.mark-cl{font-weight:700;font-size:10px;color:#2563eb}
.mark-ml{font-weight:700;font-size:10px;color:#d97706}
/* Day header colors */
.day-sun{background:#fee2e2!important;color:#991b1b!important}
.day-sat{background:#fef3c7!important}
.day-hol{background:#fed7aa!important;color:#9a3412!important}
.cell-sun{background:#fff5f5!important}
.cell-hol{background:#fff7ed!important}
.cell-absent{background:#fef2f2}
/* Print book */
@media print{
.ab-print-page{page-break-after:always;padding:10mm 8mm 8mm 12mm;font-family:Arial,sans-serif}
.ab-print-page:last-child{page-break-after:avoid}
.ab-print-header{text-align:center;margin-bottom:8px}
.ab-print-header h1{font-size:14px;font-weight:700;text-transform:uppercase}
.ab-print-header h2{font-size:12px;font-weight:700;margin:2px 0}
.ab-print-header h3{font-size:11px;font-weight:600;margin:2px 0}
.ab-print-header hr{border:none;border-top:2px solid #000;margin:5px 0 3px}
.ab-ptable{width:100%;border-collapse:collapse;font-size:9px}
.ab-ptable th{background:#e8e8e8;border:1px solid #888;padding:3px 2px;font-size:8px;font-weight:700;text-align:center}
.ab-ptable td{border:1px solid #ccc;padding:2px;text-align:center;height:22px;vertical-align:middle}
.ab-ptable td.pname{text-align:left;padding-left:4px;font-size:9px;font-weight:500;min-width:90px}
.ab-ptable td.psl{font-size:8px;color:#555;min-width:18px}
.ab-ptable td.pstat{font-weight:700;font-size:9px}
.ab-ptable .sun{background:#fee2e2}
.ab-ptable .hol{background:#fed7aa}
.ab-ptable .mx{font-weight:900;font-size:12px}
.ab-ptable .msl{font-weight:900;font-size:11px}
.ab-ptable .msr{font-weight:900;font-size:11px}
.ab-ptable .ma{font-weight:700;font-size:9px;color:#c00}
.ab-ptable .mpe{font-weight:900;font-size:10px;color:#6d28d9}
.ab-ptable .mcl{font-weight:700;font-size:8px;color:#1d4ed8}
.ab-ptable .mml{font-weight:700;font-size:8px;color:#b45309}
.ab-sign{margin-top:16px;display:flex;justify-content:space-between}

try{ S.sortBy = localStorage.getItem('iti_sort')||'name'; }catch(e){}

const acdLogRef         = () => doc(db, userPath(), "_meta", "acd_log");

// ============================================================
// PIN HASH (SHA-256)
// ============================================================
async function hashPin(pin) {
  const raw = "ITI_ATT_" + pin + "_SALT_2025";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ============================================================
// FIRESTORE OPS
// ============================================================
async function saveProfile(data) {
  const ref = doc(db, `instructors/${S.user.uid}/_meta/profile`);
  await setDoc(ref, data);
  S.profile = data;
}

async function loadProfile() {
  const ref = doc(db, `instructors/${S.user.uid}/_meta/profile`);
  const snap = await getDoc(ref);
  return snap.exists() ? snap.data() : null;
}

async function loadBatches() {
  const snap = await getDocs(batchesRef());
  S.batches = snap.docs.map(d=>({id:d.id,...d.data()}));
  S.batches.sort((a,b)=>a.name.localeCompare(b.name));
}

async function saveBatchFS(batch) {
  setSyncStatus("syncing");
  await setDoc(batchRef(batch.id), batch);
  setSyncStatus("ok");
}

async function deleteBatchFS(id) {
  setSyncStatus("syncing");
  await deleteDoc(batchRef(id));
  // Delete students in batch
  const stuSnap = await getDocs(query(studentsRef(), where("batchId","==",id)));
  const studentIds = stuSnap.docs.map(d=>d.id);
  const batch2 = writeBatch(db);
  stuSnap.docs.forEach(d => batch2.delete(d.ref));
  await batch2.commit();
  // Remove deleted students from all attendance docs
  if (studentIds.length > 0) {
    const attSnap = await getDocs(attColRef());
    const cleanBatch = writeBatch(db);
    let hasChanges = false;
    for (const attDoc of attSnap.docs) {
      const data = attDoc.data();
      const cleaned = {...data};
      let changed = false;
      studentIds.forEach(sid => { if (cleaned[sid] !== undefined) { delete cleaned[sid]; changed = true; } });
      if (changed) { cleanBatch.set(attDoc.ref, cleaned); hasChanges = true; }
    }
    if (hasChanges) await cleanBatch.commit();
  }
  setSyncStatus("ok");
}

async function loadStudents() {
  const snap = await getDocs(studentsRef());
  S.students = snap.docs.map(d=>({id:d.id,...d.data()}));
  sortStudents();
}

async function saveStudentFS(student) {
  setSyncStatus("syncing");
  await setDoc(studentRef(student.id), student);
  setSyncStatus("ok");
}

async function deleteStudentFS(id) {
  setSyncStatus("syncing");
  await deleteDoc(studentRef(id));
  // Remove student's attendance records from all attendance docs
  try {
    const attSnap = await getDocs(attColRef());
    const batch2 = writeBatch(db);
    let hasChanges = false;
    for (const attDoc of attSnap.docs) {
      const data = attDoc.data();
      if (data[id] !== undefined) {
        const cleaned = {...data};
        delete cleaned[id];
        batch2.set(attDoc.ref, cleaned);
        hasChanges = true;
      }
    }
    if (hasChanges) await batch2.commit();
  } catch(e) { /* non-critical — student already deleted */ }
  setSyncStatus("ok");
}

async function loadAttendanceMonth(year, month) {
  const from = `${year}-${pad(month+1)}-01`;
  const to   = `${year}-${pad(month+1)}-${pad(daysInMonth(year,month))}`;
  // Firestore doesn't support __name__ range queries — fetch all and filter client-side
  const snap = await getDocs(attColRef());
  snap.docs.forEach(d => {
    if (d.id >= from && d.id <= to) S.attendance[d.id] = d.data();
  });
}

async function saveAttendanceFS(dk, sid, fn, an, meta) {
  setSyncStatus("syncing");
  try {
    const ref = attRef(dk);
    const record = meta ? meta : {fn, an};
    const snap = await getDoc(ref);
    if (snap.exists()) {
      await updateDoc(ref, { [sid]: record, _updated: Date.now() });
    } else {
      await setDoc(ref, { [sid]: record, _updated: Date.now() });
    }
    setSyncStatus("ok");
  } catch(e) { setSyncStatus("error"); throw e; }
}


async function markAllFS(dk, studentIds, fn, an, lbl) {
  setSyncStatus("syncing");
  try {
    const ref = attRef(dk);
    const snap = await getDoc(ref);
    const existing = snap.exists() ? snap.data() : {};
    const updates = { _updated: Date.now() };
    studentIds.forEach(sid => {
      updates[sid] = lbl ? buildAttRecord(fn,an,lbl.name,lbl.id,existing[sid]||{}) : {fn,an};
    });
    if (snap.exists()) {
      await updateDoc(ref, updates);
    } else {
      await setDoc(ref, updates);
    }
    setSyncStatus("ok");
  } catch(e) { setSyncStatus("error"); throw e; }
}



// ============================================================
// REPORT CALCULATIONS (client-side from cached S.attendance)
// ============================================================
function calcMonthlyReport(batchId, year, month, includeSF=true) {
  const students = S.students.filter(s=>s.batchId===batchId);
  const firstDay = `${year}-${pad(month+1)}-01`;
  const lastDay  = `${year}-${pad(month+1)}-${pad(daysInMonth(year,month))}`;

  return students.map(s => {
    let mPoss=0,mPres=0,cumPoss=0,cumPres=0;
    for (const [dk,rec] of Object.entries(S.attendance)) {
      if (!rec[s.id]) continue;
      const r = rec[s.id];
      if (!r.fn && !r.an) continue;
      const poss = (r.fn?0.5:0)+(r.an?0.5:0);
      const pres = ((r.fn==="P"||r.fn==="Pe")?0.5:0)+((r.an==="P"||r.an==="Pe")?0.5:0);
      if (dk >= firstDay && dk <= lastDay) { mPoss+=poss; mPres+=pres; }
      if (dk <= lastDay) { cumPoss+=poss; cumPres+=pres; }
    }
    // Add shopfloor credits (no impact on possible)
    const mSF   = includeSF ? sfCreditsRange(s.id, firstDay, lastDay) : 0;
    const cumSF = includeSF ? sfCredits(s.id, lastDay) : 0;
    const cumPresTotal = cumPres + cumSF;
    return {
      id:s.id, adm:s.adm, name:s.name,
      monthPoss:mPoss, monthPres:mPres, monthSF:mSF,
      cumPoss, cumPres:cumPresTotal, cumSF,
      pct: cumPoss>0 ? Math.round(cumPresTotal/cumPoss*100) : 0
    };
  });
}

async function loadAttendanceRange(from, to) {
  // Fetch all attendance docs and filter client-side (Firestore __name__ range not supported)
  const snap = await getDocs(attColRef());
  snap.docs.forEach(d => {
    if (d.id >= from && d.id <= to) S.attendance[d.id] = d.data();
  });
}

async function loadAllAttendance() {
  // Load every attendance document for this instructor — filter client-side
  const snap = await getDocs(attColRef());

function calcHalfYearReport(batchId, h1s, h1e, h2s, h2e, includeSF=true) {
  const students = S.students.filter(s=>s.batchId===batchId);
  return students.map(s => {
    let h1Poss=0,h1Pres=0,h2Poss=0,h2Pres=0;
    for (const [dk,rec] of Object.entries(S.attendance)) {
      if (!rec[s.id]) continue;
      const r = rec[s.id];
      if (!r.fn && !r.an) continue;
      const poss = (r.fn?0.5:0)+(r.an?0.5:0);
      const pres = ((r.fn==="P"||r.fn==="Pe")?0.5:0)+((r.an==="P"||r.an==="Pe")?0.5:0);
      if (dk>=h1s&&dk<=h1e){ h1Poss+=poss; h1Pres+=pres; }
      if (dk>=h2s&&dk<=h2e){ h2Poss+=poss; h2Pres+=pres; }
    }
    const h1SF = includeSF ? sfCreditsRange(s.id,h1s,h1e) : 0;
    const h2SF = includeSF ? sfCreditsRange(s.id,h2s,h2e) : 0;
    const h1Total = h1Pres+h1SF, h2Total = h2Pres+h2SF;
    return {
      id:s.id, adm:s.adm, name:s.name,
      h1Poss, h1Pres:h1Total, h1SF,
      h1Pct:h1Poss>0?Math.round(h1Total/h1Poss*100):0,
      h2Poss, h2Pres:h2Total, h2SF,
      h2Pct:h2Poss>0?Math.round(h2Total/h2Poss*100):0
    };
  });
}

function uid(){ return crypto.randomUUID().replace(/-/g,"").substring(0,12); }
function pad(n){ return String(n).padStart(2,"0"); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function fmtDate(d){ const dt=d instanceof Date?d:new Date(d); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function setSyncStatus(s){ S.syncStatus=s; const el=document.getElementById("sync-dot"); if(el){el.className="sync-dot"+(s!=="ok"?" "+s:"");el.title=s==="ok"?"Saved":s==="syncing"?"Saving...":"Save error";} }

function toast(msg,type="success"){
  const el=document.createElement("div");
  el.className=`toast toast-${type}`;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
function setLoading(v,msg=""){
  let ov=document.getElementById("loading-overlay");
  if(v&&!ov){
    ov=document.createElement("div");
    ov.id="loading-overlay";
    ov.className="loading-overlay";
    ov.innerHTML=`<div class="spinner"></div>${msg?`<p>${msg}</p>`:""}`;
    document.body.appendChild(ov);
  }else if(!v&&ov){ ov.remove(); }
}

        +'</div>'
      +'</div>'
      +'<div id="acd-att-area" style="display:none"></div>'
    +'</div>'
    +'</div>';

  window._acdState = { linkData, dk, ownerUid, selectedId: null, selectedName: null, pinBuf: "" };

  window.selectAcdUser = function(id, name) {
    window._acdState.selectedId = id;
    window._acdState.selectedName = name;
    window._acdState.pinBuf = "";
    document.getElementById("acd-selected-name").textContent = name;
    document.getElementById("acd-pin-area").style.display = "block";
    document.querySelectorAll("[id^='acd-btn-']").forEach(b=>b.style.opacity="0.4");
    updateAcdDots();
  };

  window.cancelAcdSelect = function() {
    window._acdState.selectedId = null;
    window._acdState.pinBuf = "";
    document.getElementById("acd-pin-area").style.display = "none";
    document.querySelectorAll("[id^='acd-btn-']").forEach(b=>b.style.opacity="1");
    updateAcdDots();
  };

  function updateAcdDots() {
    const buf = window._acdState.pinBuf;
    for(let i=0;i<4;i++){
      const dot = document.getElementById("acd-pin-dot-"+i);
      if(dot) dot.style.background = i<buf.length ? "#1e40af" : "#e5e7eb";
    }
  }

  window.acdPinKey = async function(k) {
    const state = window._acdState;
    if(!state.selectedId) return;
    if(k==="⌫") state.pinBuf = state.pinBuf.slice(0,-1);
    else if(state.pinBuf.length<4) state.pinBuf += k;
    updateAcdDots();
    if(state.pinBuf.length===4) {
      const hash = await hashPinStandalone(state.pinBuf);
      const acd = state.linkData.acdList.find(a=>a.id===state.selectedId);
      if(hash === acd?.pinHash) {
        document.getElementById("acd-pin-err").style.display = "none";
        renderAcdAttendance(acd, state);
      } else {
        state.pinBuf = "";
        updateAcdDots();
        const err = document.getElementById("acd-pin-err");
        if(err) { err.style.display="block"; setTimeout(()=>err.style.display="none",2000); }
      }
    }
  };
}

async function hashPinStandalone(pin) {
  // Must use same salt as hashPin() in main app
  const raw = "ITI_ATT_" + pin + "_SALT_2025";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function renderAcdAttendance(acd, state) {
  const {linkData, dk, ownerUid} = state;
  const area = document.getElementById("acd-att-area");
  const loginArea = document.getElementById("acd-login-area");
  if(loginArea) loginArea.style.display = "none";
  if(area) {
    area.style.display = "block";
    area.innerHTML = '<div style="text-align:center;padding:20px"><div class="spinner"></div><p style="color:#666;margin-top:10px">Loading...</p></div>';
  }

  try {
    const allowedBatchIds = acd.batchIds||[];
    const ownerUid = state.ownerUid;

    // Read fresh students and batches directly from instructor's Firestore data
    const [batchSnap, studSnap, marksSnap] = await Promise.all([
      getDocs(collection(db, "instructors", ownerUid, "batches")),
      getDocs(collection(db, "instructors", ownerUid, "students")),
      getDoc(doc(db,"acdmarks",state.linkData.token+"_"+dk))
    ]);
    const allBatches = batchSnap.docs.map(d=>({id:d.id,...d.data()}));
    const allStudents = studSnap.docs.map(d=>({id:d.id,...d.data()}));
    const batches = allBatches.filter(b=>allowedBatchIds.includes(b.id));
    const students = allStudents.filter(s=>allowedBatchIds.includes(s.batchId));

    // Load today's attendance marks from public acdmarks collection
    const attData = marksSnap.exists() ? marksSnap.data() : {};

    state.batches = batches;
    state.students = students;
    state.attData = attData;
    state.acdName = acd.name;
    state.acdId = acd.id;
    state.token = linkData.token;

    buildAcdAttendanceUI(state);
  } catch(e) {
    if(area) area.innerHTML = '<p style="color:#dc2626;text-align:center;padding:20px">Error: '+e.message+'</p>';
  }
}

function buildAcdAttendanceUI(state) {
  const {batches, students, attData, acdName, dk} = state;
  const isP = v=>v==="P"||v==="Pe";
  const SESS = ["P","A","Pe","CL","ML"];
  const btnStyle = {
    P:"background:#dcfce7;color:#15803d;border-color:#86efac",
    A:"background:#fee2e2;color:#dc2626;border-color:#fca5a5",
    Pe:"background:#f3e8ff;color:#7c3aed;border-color:#c4b5fd",
    CL:"background:#dbeafe;color:#1d4ed8;border-color:#93c5fd",
    ML:"background:#fef3c7;color:#b45309;border-color:#fcd34d"
  };
  const area = document.getElementById("acd-att-area");
  let saved = false;
  // Track expanded cards
  const expanded = {};

  function chipFor(val) {
    if(!val) return "";
    return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;border:1px solid #e5e7eb;'+btnStyle[val]+'">'+val+'</span>';
  }

  function statusChip(fn,an) {
    if(!fn&&!an) return '<span style="font-size:11px;color:#9ca3af;font-style:italic">—</span>';
    if(fn===an) return chipFor(fn);
    return chipFor(fn)+'<span style="font-size:10px;color:#9ca3af;margin:0 2px">+</span>'+chipFor(an);
  }

  function buildBtns(sid, sess) {
    // sess = "both"|"fn"|"an"
    const att = state.attData[sid]||{fn:"",an:""};
    return SESS.map(v=>{
      const fn=att.fn||"", an=att.an||"";
      const active = sess==="both" ? (fn===v&&an===v) : sess==="fn" ? fn===v : an===v;
      return '<button onclick="acdMarkSess(\''+sid+'\',\''+sess+'\',\''+v+'\')" '
        +'style="padding:5px 9px;border-radius:6px;border:1px solid #e5e7eb;font-size:12px;font-weight:600;cursor:pointer;'+(active?btnStyle[v]:"")+'">'
        +v+'</button>';
    }).join("");
  }

  function render() {
    const cards = students.map((s,idx)=>{
      const att = state.attData[s.id]||{fn:"",an:""};
      const fn=att.fn||"", an=att.an||"";
      const chip = statusChip(fn, an);
      const batch = batches.find(b=>b.id===s.batchId);
      const isExp = !!expanded[s.id];
      const byLine = att.by
        ? '<span style="font-size:10px;color:#9ca3af;display:block;margin-top:1px">📝 '+att.by+(att.editedBy?' ✏️ '+att.editedBy:'')+'</span>'
        : '';

      const quickBtns = buildBtns(s.id,"both");
      const fnBtns   = buildBtns(s.id,"fn");
      const anBtns   = buildBtns(s.id,"an");

      return '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;overflow:hidden">'
        // Header row
        +'<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer" onclick="acdToggle(\''+s.id+'\')">'
          +'<span style="font-size:13px;font-weight:700;background:#f0f4f8;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+( idx+1)+'</span>'
          +'<div style="flex:1"><div style="font-weight:600;font-size:14px">'+s.name+'</div>'
          +(batch?'<div style="font-size:10px;color:#9ca3af">'+batch.name+'</div>':'')
          +byLine+'</div>'
          +chip
          +'<span style="color:#9ca3af;font-size:12px;margin-left:6px">'+(isExp?'▴':'▾')+'</span>'
        +'</div>'
        // Quick mark row (always visible)
        +'<div style="padding:8px 12px 10px;border-top:1px solid #f3f4f6;display:flex;gap:6px;flex-wrap:wrap">'
          +quickBtns
        +'</div>'
        // Expanded FN/AN rows
        +(isExp
          ? '<div style="padding:8px 12px 10px;border-top:1px solid #f3f4f6;background:#f8fafc">'
              +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
                +'<span style="font-size:11px;font-weight:700;color:#6b7280;width:24px">FN</span>'
                +fnBtns
              +'</div>'
              +'<div style="display:flex;align-items:center;gap:6px">'
                +'<span style="font-size:11px;font-weight:700;color:#6b7280;width:24px">AN</span>'
                +anBtns
              +'</div>'
            +'</div>'
          : '')
        +'</div>';
    }).join("");

    const present  = students.filter(s=>{const a=state.attData[s.id]||{};return isP(a.fn)&&isP(a.an);}).length;
    const unmarked = students.filter(s=>!state.attData[s.id]?.fn).length;

    area.innerHTML =
      '<div style="margin-bottom:10px;padding:8px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap">'
        +'<span>Present: <strong style="color:#16a34a">'+present+'</strong></span>'
        +'<span>Unmarked: <strong style="color:#d97706">'+unmarked+'</strong></span>'
        +'<span>Total: <strong>'+students.length+'</strong></span>'
        +'<span style="margin-left:auto;color:#9ca3af;font-size:11px">'+dk+'</span>'
      +'</div>'
      +'<div style="font-size:11px;color:#6b7280;margin-bottom:8px">Marking as: <strong>'+acdName+'</strong> &nbsp;·&nbsp; Tap ▾ to mark FN/AN separately</div>'
      +cards
      +'<div id="acd-saved-msg" style="text-align:center;margin-top:16px;padding:12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;font-size:13px;color:#15803d;display:'+(saved?"block":"none")+'">'
        +'✅ Attendance saved successfully!'
      +'</div>';
  }

  window.acdToggle = function(sid) {
    expanded[sid] = !expanded[sid];
    render();
  };

  async function saveRecord(sid, record) {
    const now = Date.now();
    try {
      const marksKey = state.token+"_"+dk;
      const marksRef = doc(db,"acdmarks",marksKey);
      const mSnap = await getDoc(marksRef);
      const upd = {[sid]:record,_uid:state.ownerUid,_dk:dk,_updated:now};
      if(mSnap.exists()) await updateDoc(marksRef,upd);
      else await setDoc(marksRef,{...upd,active:true});
      saved = true;
      const msg = document.getElementById("acd-saved-msg");
      if(msg) msg.style.display="block";
    } catch(e) { alert("Save error: "+e.message); }
  }

  window.acdMarkSess = async function(sid, sess, val) {
    const now = Date.now();
    const cur = state.attData[sid]||{fn:"",an:""};
    let fn = cur.fn||"", an = cur.an||"";
    if(sess==="both"){ fn=val; an=val; }
    else if(sess==="fn") fn=val;
    else if(sess==="an") an=val;
    const record = !cur.by
      ? {fn,an,by:state.acdName,byId:state.acdId,at:now}
      : {...cur,fn,an,editedBy:state.acdName,editedById:state.acdId,editedAt:now};
    state.attData[sid] = record;
    render();
    await saveRecord(sid, record);
  };

  // Keep old acdMark for compatibility
  window.acdMark = function(sid, val) { window.acdMarkSess(sid,"both",val); };

  render();
}

async function checkParentView() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('view');
  if (!token) return false;
  const root = document.getElementById("root");
  root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f4f6f9"><div style="text-align:center;padding:40px"><div class=\"spinner\"></div><p style=\"margin-top:12px;color:#666;font-size:14px\">Loading attendance...</p></div></div>';
  try {
    const snap = await getDoc(pubLinkRef(token));
    if (!snap.exists() || !snap.data().active) { root.innerHTML = renderExpiredLink(); return true; }
    const linkMeta = snap.data();

    // Always load TODAY's attendance fresh from the instructor's Firestore
    async function loadAndRender() {
      try {
        const today = new Date();
        const dk = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
        const dowFull = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][today.getDay()];
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const dateLabel = `${today.getDate()} ${months[today.getMonth()]} ${today.getFullYear()} (${dowFull})`;

        // Read today's attendance from instructor's private collection
        const ownerUid = linkMeta.uid||linkMeta.ownerUid||"";
        if(!ownerUid) throw new Error("Link data missing instructor ID. Please ask instructor to regenerate the link.");
        const attSnap = await getDoc(doc(db, "instructors", ownerUid, "attendance", dk));
        const attData = attSnap.exists() ? attSnap.data() : {};

        // Read students from instructor's private collection
        const studSnap = await getDocs(collection(db, "instructors", ownerUid, "students"));
        const allStudents = studSnap.docs.map(d=>({id:d.id,...d.data()}));
        const students = allStudents.filter(s=>s.batchId===linkMeta.batchId);

        // Build list
        const isP = v=>v==="P"||v==="Pe";
        const list = students.map(s=>{
          const r = attData[s.id]||{fn:"",an:""};
          const fn=String(r.fn||""), an=String(r.an||"");
          let statusCode="";
          if(fn&&an){
            if(fn===an) statusCode=fn;
            else if(isP(fn)&&!isP(an)) statusCode="AP";
            else if(!isP(fn)&&isP(an)) statusCode="PA";
            else statusCode="A";
          } else if(fn) statusCode=fn;
          else if(an) statusCode=an;
          return {name:String(s.name||""), adm:String(s.adm||s.admNo||""), statusCode:String(statusCode)};
        });
        const presentCount = list.filter(s=>s.statusCode==="P").length;
        const absentList   = ["A","CL","ML","PA","AP"];
        const absentCount  = list.filter(s=>absentList.indexOf(s.statusCode)>-1).length;
        const stats = {
          present:    presentCount,
          absent:     absentCount,
          total:      students.length,
          permission: list.filter(s=>s.statusCode==="Pe").length,
          halfDay:    list.filter(s=>s.statusCode==="PA"||s.statusCode==="AP").length,
          cl:         list.filter(s=>s.statusCode==="CL").length,
          ml:         list.filter(s=>s.statusCode==="ML").length
        };
        const viewData = {
          inst: linkMeta.inst,
          bname: linkMeta.bname,
          mode: linkMeta.mode||"absent",
          dateLabel, stats, list,
          updatedAt: Date.now()
        };
        renderParentView(viewData);
      } catch(e) {
        // If uid missing, show helpful message
        if(!linkMeta.uid && !linkMeta.ownerUid){
          root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f4f6f9;font-family:sans-serif"><div style="text-align:center;padding:40px;max-width:340px"><div style="font-size:48px;margin-bottom:16px">🔗</div><h2 style="font-size:18px;font-weight:700;margin-bottom:8px">Link needs refresh</h2><p style="color:#666;font-size:14px;line-height:1.6">Please ask your instructor to tap <strong>Parent Link</strong> in the attendance page once to reactivate this link.</p></div></div>';
        } else {
          renderParentView(linkMeta); // fall back to stored data
        }
      }
    }

    await loadAndRender();

    // Real-time listener on attendance doc — triggers instantly when instructor marks
    const today = new Date();
    const dk = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
    const ownerUid = linkMeta.uid||linkMeta.ownerUid||"";
    if(ownerUid){
      const attDocRef = doc(db, "instructors", ownerUid, "attendance", dk);
      onSnapshot(attDocRef, ()=>{ loadAndRender(); });
    }
  } catch(e) {
    root.innerHTML = '<div style=\"text-align:center;padding:60px;font-family:sans-serif\"><div style=\"font-size:36px\">⚠️</div><h2>Unable to load</h2><p style=\"color:#666\">' + e.message + '</p></div>';
  }
  return true;
}

function renderExpiredLink() {
  return '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f4f6f9;font-family:sans-serif"><div style="text-align:center;padding:40px;max-width:340px"><div style="font-size:48px;margin-bottom:16px">🔗</div><h2 style="font-size:20px;font-weight:700;margin-bottom:8px">Link Expired</h2><p style="color:#666;font-size:14px;line-height:1.6">This attendance link is no longer active. The instructor may have generated a new link.</p></div></div>';
}

function renderParentView(data) {
  const root = document.getElementById("root");

  const statusColor = {P:"#16a34a",A:"#dc2626",Pe:"#7c3aed",CL:"#1d4ed8",ML:"#b45309",PA:"#d97706",AP:"#d97706",""  :"#999"};
  const statusEmoji = {P:"✅",A:"❌",Pe:"🔵",CL:"🟡",ML:"🟠",PA:"🕐",AP:"🕐","":"⬜"};
  const statusLabel = {P:"Present",A:"Absent",Pe:"Permission",CL:"Casual Leave",ML:"Medical Leave",PA:"AN Absent",AP:"FN Absent","":"Not marked"};

  const sc = (code, txt) => '<span style="background:#f3f4f6;border:1px solid #e5e7eb;border-radius:20px;padding:3px 10px;font-size:12px;color:' + (statusColor[code]||"#666") + '">' + txt + '</span>';

  let listHTML = "";

    const notPresent = list.filter(s=>s.statusCode==="A"||s.statusCode==="CL"||s.statusCode==="ML"||s.statusCode==="PA"||s.statusCode==="AP");
    const unmarked   = list.filter(s=>s.statusCode==="");

  }

  const extraBadges = [
    stats.permission ? "🔵 Permission: " + stats.permission : "",
    stats.halfDay    ? "🕐 Half day: " + stats.halfDay : "",
    stats.cl         ? "🟡 CL: " + stats.cl : "",
    stats.ml         ? "🟠 ML: " + stats.ml : "",
    notMarkedCount   ? "⬜ Not marked: " + notMarkedCount : ""
  ].filter(Boolean).map(t=>'<span style="background:#f3f4f6;border:1px solid #e5e7eb;border-radius:20px;padding:3px 10px;font-size:12px;color:#555">' + t + '</span>').join("");

  root.innerHTML =
    '<div style="max-width:480px;margin:0 auto;padding:0 0 40px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">' +
    '<div style="background:#1e40af;color:#fff;padding:20px 16px 16px">' +
      '<div style="font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Attendance Report</div>' +
      '<div style="font-size:18px;font-weight:700;margin-bottom:2px">' + inst + '</div>' +
      '<div style="font-size:14px;opacity:.9">' + bname + '</div>' +
      '<div style="font-size:12px;opacity:.75;margin-top:4px">📅 ' + dateLabel + '</div>' +
    '</div>' +
    '<div style="padding:16px">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 14px">' +
        '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;text-align:center"><div style="font-size:24px;font-weight:700;color:#16a34a">' + stats.present + '</div><div style="font-size:11px;color:#166534">Present</div></div>' +

      '</div>' +
      (extraBadges ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">' + extraBadges + '</div>' : '') +
      '<div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:8px">' + (mode==="absent"?"Students not fully present today":"All students attendance") + '</div>' +
      '<div>' + listHTML + '</div>' +
    '</div>' +
    '<div style="text-align:center;padding:16px;font-size:11px;color:#9ca3af;border-top:1px solid #f0f0f0">' +
      '<div>⚡ Live — updates instantly when attendance changes</div>' +
      (updated ? '<div style="margin-top:4px">Last updated: ' + updated + '</div>' : '') +
      '<div style="margin-top:4px">ITI Attendance System</div>' +
    '</div>' +
    '</div>';
}

      S.user = user;
      setLoading(true,"Loading your data...");
    try {
      S.profile = await loadProfile();
      if (!S.profile) {
        setLoading(false);
        renderProfileSetup();
        return;
      }
      // Sync printDetails from profile
      S.printDetails = {
        name: S.profile.name||"",
        position: S.profile.position||"SI",
        trade: S.profile.trade||"",
        printDate: true
      };
      setLoading(false);
      renderPin("");
    } catch(e) {
      setLoading(false);
      toast("Error loading profile: "+e.message,"error");
      renderLogin();
    }
  } else {
      S.user = null;
      S.profile = null;
      S.isUnlocked = false;
      renderLogin();
    }
  }); // end onAuthStateChanged
}); // end checkParentView/ACD

let pinBuffer="", pinError=false;

function renderPin(errorMsg){
  const p = S.profile||{};
  const u = S.user;
  document.getElementById("root").innerHTML=`
<div class="pin-screen">
  <div class="pin-card">
    <div style="text-align:center;margin-bottom:4px">
      <div style="font-size:36px;margin-bottom:10px">🔐</div>

      <p class="text-xs text-muted">${u?u.email:""}</p>
    </div>
    <p class="text-sm text-secondary" style="text-align:center;margin:14px 0 4px">Enter 4-digit PIN</p>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div>
      <div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    ${errorMsg?`<p class="text-sm text-danger" style="text-align:center;margin-bottom:8px">${errorMsg}</p>`:""}
    <div class="pin-keypad">
      ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>
        k===""?`<div></div>`:`<button class="pin-key" data-key="${k}">${k}</button>`
      ).join("")}
    </div>
    <button class="btn btn-secondary btn-sm" id="btn-signout-pin" style="width:100%;margin-top:16px;font-size:12px">Sign out</button>
  </div>
</div>`;
  pinBuffer=""; pinError=false;
  document.querySelectorAll(".pin-key").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const k=btn.dataset.key;
      if(k==="⌫") pinBuffer=pinBuffer.slice(0,-1);
      else if(pinBuffer.length<4) pinBuffer+=k;
      updatePinDots();
      if(pinBuffer.length===4) submitPin();
    });
  });
  document.getElementById("btn-signout-pin").addEventListener("click",()=>signOut(auth));
  document.onkeydown=e=>{
    if(/^\d$/.test(e.key)&&pinBuffer.length<4){pinBuffer+=e.key;updatePinDots();if(pinBuffer.length===4)submitPin();}
    if(e.key==="Backspace"){pinBuffer=pinBuffer.slice(0,-1);updatePinDots();}
  };
}

function updatePinDots(){
  document.querySelectorAll(".pin-dot").forEach((d,i)=>{
    d.classList.toggle("filled",i<pinBuffer.length);
    d.classList.toggle("error",pinError);
  });
}

async function submitPin(){
  const attempt=pinBuffer;
  const hash=await hashPin(attempt);
  if(hash===S.profile.pinHash){
    document.onkeydown=null;
    S.isUnlocked=true;
    setLoading(true,"Loading attendance data...");
    try{
      await loadAll();
      renderApp();
    }catch(e){ toast("Load error: "+e.message,"error"); }
    finally{ setLoading(false); }
  } else {
    pinError=true;
    updatePinDots();
    setTimeout(()=>{
      pinBuffer=""; pinError=false;
      renderPin("Incorrect PIN. Try again.");
    },700);
  }
}

const SF_VALUES = [
  {val:0.25, label:"¼", title:"Quarter day"},

// Sync ACD marks from public acdmarks collection into instructor's attendance
async function syncAcdMarks() {
  if (!S.acdLink?.token) return;
  const dk = `${S.attState.year}-${pad(S.attState.month+1)}-${pad(Math.min(S.attState.day,daysInMonth(S.attState.year,S.attState.month)))}`;
  try {
    const marksKey = S.acdLink.token+"_"+dk;
    const snap = await getDoc(acdMarksRef(marksKey));
    if (!snap.exists()) return;
    const data = snap.data();
    // Write each mark to instructor's real attendance collection
    const attRef2 = attRef(dk);
    const attSnap = await getDoc(attRef2);
    const existing = attSnap.exists() ? attSnap.data() : {};
    let changed = false;
    Object.entries(data).forEach(([sid,rec])=>{
      if(sid.startsWith("_")) return; // skip meta fields
      if(!existing[sid] || JSON.stringify(existing[sid])!==JSON.stringify(rec)){
        existing[sid] = rec;
        if(!S.attendance[dk]) S.attendance[dk]={};
        S.attendance[dk][sid] = rec;
        changed = true;
      }
    });
    if(changed){
      existing._updated = Date.now();
      if(attSnap.exists()) await updateDoc(attRef2, existing);
      else await setDoc(attRef2, existing);
      toast("ACD marks synced","info");
    }
  } catch(e) { /* silent - non critical */ }
}

async function loadShopfloor() {
  const snap = await getDocs(shopfloorRef());
  S.shopfloor = {};
  snap.docs.forEach(d => { S.shopfloor[d.id] = d.data(); });
}

async function saveSFEntry(dk, sid, val) {
  setSyncStatus("syncing");
  try {
    const ref = sfDayRef(dk);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      if (val === null) {
        // Remove entry
        const data = {...snap.data()};
        delete data[sid];
        await setDoc(ref, data);
        if (S.shopfloor[dk]) delete S.shopfloor[dk][sid];
      } else {
        await updateDoc(ref, { [sid]: val });
        if (!S.shopfloor[dk]) S.shopfloor[dk] = {};
        S.shopfloor[dk][sid] = val;
      }
    } else if (val !== null) {
      await setDoc(ref, { [sid]: val });
      S.shopfloor[dk] = { [sid]: val };
    }
    setSyncStatus("ok");
  } catch(e) { setSyncStatus("error"); throw e; }
}

async function clearSFDay(dk, studentIds) {
  setSyncStatus("syncing");
  try {
    const ref = sfDayRef(dk);
    await setDoc(ref, {});
    S.shopfloor[dk] = {};
    setSyncStatus("ok");
  } catch(e) { setSyncStatus("error"); throw e; }
}

async function loadShopfloorData() {
  setLoading(true, "Loading shopfloor...");

// Get total shopfloor credits for a student up to a date
function sfCredits(sid, upToDk) {
  let total = 0;
  for (const [dk, rec] of Object.entries(S.shopfloor)) {
    if (upToDk && dk > upToDk) continue;
    if (rec[sid]) total += parseFloat(rec[sid]);
  }
  return total;
}

// Get shopfloor credits for a student in a date range
function sfCreditsRange(sid, fromDk, toDk) {
  let total = 0;
  for (const [dk, rec] of Object.entries(S.shopfloor)) {
    if (dk < fromDk || dk > toDk) continue;
    if (rec[sid]) total += parseFloat(rec[sid]);
  }
  return total;
}

function getCellMark(fn, an) {
  if (fn==="CL"||an==="CL") return {mark:"CL", cls:"mark-cl"};
  if (fn==="ML"||an==="ML") return {mark:"ML", cls:"mark-ml"};
  const fp=fn==="P"||fn==="Pe", ap=an==="P"||an==="Pe";
  const fpe=fn==="Pe", ape=an==="Pe";
  const fa=fn==="A", aa=an==="A";
  // Both sessions present (P or Pe)
  if (fp && ap) {
    if (fpe && ape) return {mark:"P",  cls:"mark-pe"};  // Pe+Pe
    if (fpe)        return {mark:"P╱", cls:"mark-pe"};  // Pe+P
    if (ape)        return {mark:"P╲", cls:"mark-pe"};  // P+Pe
    return {mark:"✗", cls:"mark-x"};                    // P+P
  }
  // FN present, AN absent
  if (fp && aa) return fpe ? {mark:"P╲",cls:"mark-pe"} : {mark:"╲",cls:"mark-sr"};
  // FN absent, AN present
  if (fa && ap) return ape ? {mark:"P╱",cls:"mark-pe"} : {mark:"╱",cls:"mark-sl"};
  // Only one session marked
  if (fp && !an) return fpe ? {mark:"P",cls:"mark-pe"} : {mark:"╱",cls:"mark-sl"};
  if (!fn && ap) return ape ? {mark:"P",cls:"mark-pe"} : {mark:"╲",cls:"mark-sr"};
  // Both absent
  if (fa || aa) return {mark:"A", cls:"mark-a"};
  return {mark:"", cls:""};
}

function getPrintMark(fn, an) {
  if (fn==="CL"||an==="CL") return {mark:"CL", cls:"mcl"};
  if (fn==="ML"||an==="ML") return {mark:"ML", cls:"mml"};
  const fp=fn==="P"||fn==="Pe", ap=an==="P"||an==="Pe";
  const fpe=fn==="Pe", ape=an==="Pe";
  const fa=fn==="A", aa=an==="A";
  if (fp&&ap){
    if(fpe&&ape) return {mark:"P",  cls:"mpe"};
    if(fpe)      return {mark:"P╱", cls:"mpe"};
    if(ape)      return {mark:"P╲", cls:"mpe"};
    return {mark:"✗",cls:"mx"};
  }
  if (fp&&aa) return fpe?{mark:"P╲",cls:"mpe"}:{mark:"╲",cls:"msr"};
  if (fa&&ap) return ape?{mark:"P╱",cls:"mpe"}:{mark:"╱",cls:"msl"};
  if (fp&&!an) return fpe?{mark:"P",cls:"mpe"}:{mark:"╱",cls:"msl"};
  if (!fn&&ap) return ape?{mark:"P",cls:"mpe"}:{mark:"╲",cls:"msr"};
  if (fa||aa) return {mark:"A",cls:"ma"};
  return {mark:"",cls:""};
}

function renderAttBook() {
  const {batchId, year, month} = attBookState;
  const bOpts = S.batches.map(b=>`<option value="${b.id}"${batchId===b.id?" selected":""}>${b.name}</option>`).join("");
  const mOpts = MONTHS.map((m,i)=>`<option value="${i}"${month===i?" selected":""}>${m}</option>`).join("");
  const students = S.students.filter(s=>s.batchId===batchId);
  const totalDays = daysInMonth(year, month);
  const days = Array.from({length:totalDays},(_,i)=>i+1);

  // Build day headers
  const dayHeaders = days.map(d => {
    const dt = new Date(year, month, d);
    const dow = dt.getDay(); // 0=Sun
    const dk = `${year}-${pad(month+1)}-${pad(d)}`;
    const isSun = dow===0;
    const isHol = !!S.holidays[dk];
    const dayName = ["Su","Mo","Tu","We","Th","Fr","Sa"][dow];
    const cls = isSun?"day-sun":isHol?"day-hol":dow===6?"day-sat":"";
    return `<th class="ab-num ${cls}" title="${dk}${isHol?" — "+S.holidays[dk].name:""}">${d}<br><span style="font-size:9px;font-weight:400">${dayName}</span></th>`;
  }).join("");

  // Build student rows
  const rows = students.map((s,idx) => {
    let poss=0, pres=0;
    const cells = days.map(d => {
      const dk = `${year}-${pad(month+1)}-${pad(d)}`;
      const dt = new Date(year, month, d); // local date - safe
      const isSun = dt.getDay()===0;
      const isHol = !!S.holidays[dk];
      if (isSun) return `<td class="cell-sun" title="Sunday">-</td>`;
      if (isHol) return `<td class="cell-hol" title="${S.holidays[dk].name}">H</td>`;
      const r = (S.attendance[dk]||{})[s.id]||{fn:"",an:""};
      const {mark,cls} = getCellMark(r.fn, r.an);
      // Count poss/pres
      if (r.fn==="CL"||r.fn==="ML") { poss+=1; }
      else { if(r.fn)poss+=0.5; if(r.an)poss+=0.5; }
      if(r.fn==="P"||r.fn==="Pe")pres+=0.5; if(r.an==="P"||r.an==="Pe")pres+=0.5;
      const bgCls = (r.fn==="A"&&r.an==="A")?"cell-absent":"";
      return `<td class="${bgCls}" title="${dk} FN:${r.fn||"-"} AN:${r.an||"-"}"><span class="${cls}">${mark}</span></td>`;
    }).join("");
    const pct = poss>0?Math.round(pres/poss*100):0;
    const pctCls = pct<PCT_WARN?"pct-critical":pct<PCT_WARN+5?"pct-warn":"pct-ok";
    return `<tr>
      <td class="ab-sl">${idx+1}</td>
      <td class="ab-name">${s.name}</td>
      ${cells}
      <td class="ab-stat">${poss}</td>
      <td class="ab-stat">${pres}</td>
      <td class="ab-stat ${pctCls}">${pct}%</td>
    </tr>`;
  }).join("") || `<tr><td colspan="${totalDays+5}" style="padding:20px;text-align:center;color:var(--text3)">No students in this batch.</td></tr>`;

  const pd = S.printDetails;
  const posOpts = POSITIONS.map(p=>`<option value="${p.val}"${pd.position===p.val?" selected":""}>${p.label} (${p.val})</option>`).join("");

  return `
<div class="card mb12">
  <div class="card-body">
    <div class="flex flex-wrap" style="gap:10px;align-items:flex-end">
      <div><label class="form-label">Batch</label><select style="width:200px" id="ab-batch">${bOpts}</select></div>
      <div><label class="form-label">Month</label><select style="width:130px" id="ab-month">${mOpts}</select></div>
      <div><label class="form-label">Year</label><input type="number" id="ab-year" value="${year}" style="width:85px"/></div>
      <button class="btn btn-secondary btn-sm" style="margin-top:18px" data-action="ab-add-holiday">🗓️ Mark Holiday</button>
      <button class="btn btn-primary btn-sm" style="margin-top:18px" data-action="ab-print">🖨️ Print Register</button>
    </div>
    ${Object.keys(S.holidays).filter(dk=>dk.startsWith(`${year}-${pad(month+1)}`)).length>0?`
    <div class="mt8 flex flex-wrap" style="gap:6px">
      ${Object.entries(S.holidays).filter(([dk])=>dk.startsWith(`${year}-${pad(month+1)}`)).map(([dk,h])=>`
      <span style="background:#fff7ed;border:1px solid #fed7aa;border-radius:4px;padding:2px 8px;font-size:11px">
        🟠 ${dk.split("-")[2]} ${MONTHS[month].slice(0,3)} — ${h.name}
        <button style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:11px;padding:0 2px" data-action="ab-del-holiday" data-dk="${dk}">✕</button>
      </span>`).join("")}
    </div>`:""}
    <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px">
      <div class="text-xs fw500 text-muted mb8" style="text-transform:uppercase;letter-spacing:.04em">Print details</div>
      <div class="flex flex-wrap" style="gap:8px;align-items:flex-end">
        <div><label class="form-label">Name</label><input id="ab-pd-name" value="${pd.name}" style="width:160px"/></div>

async function loadAcdData() {
  try {
    const [instSnap, linkSnap, logSnap] = await Promise.all([
      getDoc(acdInstructorsRef()),
      getDoc(acdLinkRef()),
      getDoc(acdLogRef())
    ]);
    S.acdInstructors = instSnap.exists() ? (instSnap.data().list||[]) : [];
    S.acdLink = linkSnap.exists() ? linkSnap.data() : null;
    S.acdLog = logSnap.exists() ? (logSnap.data().entries||[]) : [];
  } catch(e) { /* silent */ }
}

async function saveAcdInstructors() {
  await setDoc(acdInstructorsRef(), { list: S.acdInstructors });
}

async function generateAcdLink() {
  const token = genToken();
  // Only store name, pinHash, batchIds, active — never expose raw PIN
  const safeList = S.acdInstructors.map(a=>({
    id:a.id, name:a.name, pinHash:a.pinHash,
    batchIds:a.batchIds||[], active:a.active
  }));
  // Build batch + student snapshot for all allowed batches
  const allBatchIds = [...new Set(S.acdInstructors.flatMap(a=>a.batchIds||[]))];
  const batchSnapshot = S.batches
    .filter(b=>allBatchIds.includes(b.id))
    .map(b=>({id:b.id,name:b.name,trade:b.trade,year:b.year}));
  const studentSnapshot = S.students
    .filter(s=>allBatchIds.includes(s.batchId))
    .map(s=>({id:s.id,adm:s.adm,name:s.name,batchId:s.batchId}));

  const payload = {
    token,
    uid: S.user.uid,
    inst: S.profile?.institute||"Govt ITI Dhanuvachapuram",
    instrName: S.profile?.name||"",
    acdList: safeList,
    batches: batchSnapshot,
    students: studentSnapshot,
    created: Date.now(),
    active: true
  };
  await Promise.all([
    setDoc(acdLinkRef(), { token, created: Date.now() }),
    setDoc(pubAcdRef(token), payload)
  ]);
  S.acdLink = { token, created: Date.now() };
  return token;
}

async function revokeAcdLink() {
  if (!S.acdLink?.token) return;
  await setDoc(pubAcdRef(S.acdLink.token), { active: false }, { merge: true });
  await setDoc(acdLinkRef(), { token: S.acdLink.token, active: false, created: S.acdLink.created });
  S.acdLink = null;
}

// Called from ACD page after marking — logs activity to instructor's Firestore
async function logAcdActivity(uid, entry) {
  // entry: {name, batchName, count, at, byId}
  const ref = doc(db, "instructors", uid, "_meta", "acd_log");
  const snap = await getDoc(ref);
  const existing = snap.exists() ? (snap.data().entries||[]) : [];
  // Keep last 50 entries
  const updated = [entry, ...existing].slice(0, 50);
  await setDoc(ref, { entries: updated });
}

// Attendance marking with "by" metadata
function buildAttRecord(fn, an, byName, byId, existing) {
  const now = Date.now();
  if (!existing || (!existing.by)) {
    // First mark
    return { fn, an, by: byName, byId, at: now };
  } else {
    // Edit
    return { fn, an,
      by: existing.by, byId: existing.byId, at: existing.at,
      editedBy: byName, editedById: byId, editedAt: now
    };
  }
}

function attByLine(rec) {
  if (!rec || !rec.by) return "";
  const byTime = rec.at ? new Date(rec.at).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}) : "";
  let line = `<span style="font-size:10px;color:var(--text3);margin-top:2px;display:block">📝 ${rec.by}${byTime?" — "+byTime:""}</span>`;
  if (rec.editedBy) {
    const et = rec.editedAt ? new Date(rec.editedAt).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}) : "";
    line += `<span style="font-size:10px;color:#b45309;display:block">✏️ Edited: ${rec.editedBy}${et?" — "+et:""}</span>`;
  }
  return line;
}

function genToken() {
  const arr = new Uint8Array(15);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(36).padStart(2,'0')).join('').substring(0,24);
}

function buildShareText(dk, bname, inst, dateLabel, total, mode) {
  const students = S.students.filter(s=>s.batchId===S.attState.batchId);
  const isP = v => v==="P"||v==="Pe";
  const NL = "\n";
  const LINE = "------------------------------";

  const statusOf = (s) => {
    const r=(S.attendance[dk]||{})[s.id]||{fn:"",an:""};
    const fp=isP(r.fn), ap=isP(r.an);
    if(r.fn==="CL"||r.an==="CL") return{emoji:"CL",label:"Casual Leave",sort:4};
    if(r.fn==="ML"||r.an==="ML") return{emoji:"ML",label:"Medical Leave",sort:5};
    if((r.fn==="Pe"||r.an==="Pe")&&fp&&ap) return{emoji:"Pe",label:"Permission",sort:3};
    if(fp&&ap) return{emoji:"P",label:"Present",sort:1};
    if(fp&&!ap) return{emoji:"P/",label:"FN Present / AN Absent",sort:6};
    if(!fp&&ap) return{emoji:"/P",label:"FN Absent / AN Present",sort:6};
    if(r.fn==="A"||r.an==="A") return{emoji:"A",label:"Absent",sort:2};
    return{emoji:"-",label:"Not marked",sort:7};
  };

  let msg = "*" + inst + "*" + NL;
  msg += "*" + bname + "*" + NL;
  msg += "Date: " + dateLabel + NL;
  msg += LINE + NL + NL;

  if(mode==="absent"){
    const absent=[], halfFN=[], halfAN=[], permission=[], clList=[], mlList=[], notMarked=[];
    students.forEach(s=>{
      const r=(S.attendance[dk]||{})[s.id]||{fn:"",an:""};
      const fp=isP(r.fn), ap=isP(r.an);
      const entry="- " + s.name + " (" + s.adm + ")";
      if(r.fn==="CL"||r.an==="CL"){clList.push(entry);return;}
      if(r.fn==="ML"||r.an==="ML"){mlList.push(entry);return;}
      if(r.fn==="Pe"||r.an==="Pe"){if(fp&&ap){permission.push(entry);return;}}
      if(fp&&ap) return;
      if(fp&&!ap){halfAN.push(entry);return;}
      if(!fp&&ap){halfFN.push(entry);return;}
      if(r.fn==="A"||r.an==="A"){absent.push(entry);return;}
      if(!r.fn&&!r.an){notMarked.push(entry);return;}
    });
    const presentCount=students.filter(s=>{const r=(S.attendance[dk]||{})[s.id]||{fn:"",an:""};return isP(r.fn)&&isP(r.an);}).length;

    if(absent.length)    msg += "*ABSENT (" + absent.length + "):*" + NL + absent.join(NL) + NL + NL;
    if(halfFN.length)    msg += "*FN ABSENT (" + halfFN.length + "):*" + NL + halfFN.join(NL) + NL + NL;
    if(halfAN.length)    msg += "*AN ABSENT (" + halfAN.length + "):*" + NL + halfAN.join(NL) + NL + NL;
    if(permission.length)msg += "*PERMISSION (" + permission.length + "):*" + NL + permission.join(NL) + NL + NL;
    if(clList.length)    msg += "*CASUAL LEAVE (" + clList.length + "):*" + NL + clList.join(NL) + NL + NL;
    if(mlList.length)    msg += "*MEDICAL LEAVE (" + mlList.length + "):*" + NL + mlList.join(NL) + NL + NL;
    if(notMarked.length) msg += "*NOT MARKED (" + notMarked.length + "):*" + NL + notMarked.join(NL) + NL + NL;

    msg += LINE + NL;
    msg += "Present: " + presentCount + " | Total: " + total;
  } else {
    students.forEach((s,i)=>{
      const st=statusOf(s);
      msg += (i+1) + ". " + s.name + " (" + s.adm + ") [" + st.emoji + "] " + st.label + NL;
    });
    const presentCount=students.filter(s=>{const r=(S.attendance[dk]||{})[s.id]||{fn:"",an:""};return isP(r.fn)&&isP(r.an);}).length;
    const absentCount=students.filter(s=>{const r=(S.attendance[dk]||{})[s.id]||{fn:"",an:""};return r.fn==="A"&&r.an==="A";}).length;
    msg += NL + LINE + NL;
    msg += "Present: " + presentCount + " | Absent: " + absentCount + " | Total: " + total;
  }

  msg += NL + NL + "_Sent via ITI Attendance System_";
  return msg;
}

    <div class="pin-dot"></div><div class="pin-dot"></div>

    ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>

    ).join("")}
  </div>
</div>
<div class="modal-footer">
  <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
</div>`);

  function updateDots(){
    document.querySelectorAll("#vpin-dots .pin-dot").forEach((d,i)=>{
      d.classList.toggle("filled", i < pinBuf.length);
    });
  }

  document.querySelectorAll("[data-vkey]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const k = btn.dataset.vkey;
      if(k==="⌫") pinBuf=pinBuf.slice(0,-1);
      else if(pinBuf.length<4) pinBuf+=k;
      updateDots();
      if(pinBuf.length===4){
        const hash = await hashPin(pinBuf);
        if(hash===S.profile.pinHash){
          closeModal();
          onSuccess();
        } else {
          pinBuf="";
          updateDots();
          const err=document.getElementById("vpin-err");
          if(err){ err.style.display="block"; setTimeout(()=>{err.style.display="none";},2000); }
        }
      }
    });
  });

function printAttBook() {
  const {batchId, year, month} = attBookState;
  const name = (document.getElementById("ab-pd-name")?.value||S.printDetails.name).trim();
  const pos  = document.getElementById("ab-pd-pos")?.value || S.printDetails.position;
  const trade= (document.getElementById("ab-pd-trade")?.value||S.printDetails.trade).trim();
  const printDate = document.getElementById("ab-pd-date")?.checked ?? S.printDetails.printDate;
  const instrLabel = `${name} (${pos}, ${trade})`;
  const now = new Date().toLocaleDateString("en-IN");
  const dateStr = printDate ? now : "";
  const inst = S.profile?.institute || "Govt ITI Dhanuvachapuram";
  const batch = S.batches.find(b=>b.id===batchId);
  const bname = batch?.name||""; const btrade = batch?.trade||""; const acYear = batch?.year||"";
  const students = S.students.filter(s=>s.batchId===batchId);
  const totalDays = daysInMonth(year, month);
  const days = Array.from({length:totalDays},(_,i)=>i+1);
  const monthLabel = `${MONTHS[month]} ${year}`;

  // ── helpers ──
  const isP = v => v==="P"||v==="Pe";
  const dk = d => `${year}-${pad(month+1)}-${pad(d)}`;

  // CL/ML availed per student
  function clCount(sid){
    let c=0;
    days.forEach(d=>{
      const r=(S.attendance[dk(d)]||{})[sid]||{fn:"",an:""};
      if(r.fn==="CL"||r.an==="CL") c++;
    });
    return c;
  }
  function mlCount(sid){
    let c=0;
    days.forEach(d=>{
      const r=(S.attendance[dk(d)]||{})[sid]||{fn:"",an:""};
      if(r.fn==="ML"||r.an==="ML") c++;
    });
    return c;
  }

  // Month poss/pres per student
  function monthStats(sid){
    let poss=0,pres=0;
    days.forEach(d=>{
      const dt=new Date(year,month,d);
      if(dt.getDay()===0||S.holidays[dk(d)]) return;
      const r=(S.attendance[dk(d)]||{})[sid]||{fn:"",an:""};
      if(r.fn==="CL"||r.fn==="ML"){poss+=1;}
      else{if(r.fn)poss+=0.5; if(r.an)poss+=0.5;}
      if(isP(r.fn))pres+=0.5; if(isP(r.an))pres+=0.5;
    });
    return{poss,pres};
  }

  // Cumulative poss/pres
  function cumStats(sid){
    const lastDay=`${year}-${pad(month+1)}-${pad(totalDays)}`;
    let poss=0,pres=0;
    for(const [d,rec] of Object.entries(S.attendance)){
      if(d>lastDay) continue;
      const r=rec[sid]; if(!r||(!r.fn&&!r.an)) continue;
      if(r.fn==="CL"||r.fn==="ML"){poss+=1;}
      else{if(r.fn)poss+=0.5; if(r.an)poss+=0.5;}
      if(isP(r.fn))pres+=0.5; if(isP(r.an))pres+=0.5;
    }
    return{poss,pres};
  }

  // CL eligibility (standard = 8 per year, show remaining)
  const CL_ELIGIBLE = 8;

  // Day header: sun=red, hol=orange, sat=light
  function dayTh(d){
    const dt=new Date(year,month,d); const dow=dt.getDay(); // new Date(y,m,d) uses local time — correct
    const isSun=dow===0; const isHol=!!S.holidays[dk(d)];
    const dn=["Su","Mo","Tu","We","Th","Fr","Sa"][dow];
    const bg=isSun?"#ffd6d6":isHol?"#ffd9b3":dow===6?"#fffbe6":"";
    return `<th style="min-width:16px;font-size:7px;padding:2px 1px;${bg?"background:"+bg+";":""}text-align:center">${d}<br><span style="font-weight:400;font-size:6px">${dn}</span></th>`;
  }

  // Cell mark
  function cellMark(fn,an){
    if(fn==="CL"||an==="CL") return{t:"CL",c:"#1d4ed8"};
    if(fn==="ML"||an==="ML") return{t:"ML",c:"#b45309"};
    const fp=isP(fn),ap=isP(an),fpe=fn==="Pe",ape=an==="Pe";
    const fa=fn==="A",aa=an==="A";
    if(fp&&ap){
      if(fpe&&ape) return{t:"P",c:"#6d28d9"};
      if(fpe)      return{t:"P╱",c:"#6d28d9"};
      if(ape)      return{t:"P╲",c:"#6d28d9"};
      return{t:"✗",c:"#111"};
    }
    if(fp&&aa) return fpe?{t:"P╲",c:"#6d28d9"}:{t:"╲",c:"#111"};
    if(fa&&ap) return ape?{t:"P╱",c:"#6d28d9"}:{t:"╱",c:"#111"};
    if(fp&&!an) return fpe?{t:"P",c:"#6d28d9"}:{t:"╱",c:"#111"};
    if(!fn&&ap) return ape?{t:"P",c:"#6d28d9"}:{t:"╲",c:"#111"};
    if(fa||aa) return{t:"A",c:"#c00"};
    return{t:"",c:""};
  }

  // Daily FN/AN totals
  function dayTotal(d,sess){
    let cnt=0;
    students.forEach(s=>{
      const r=(S.attendance[dk(d)]||{})[s.id]||{fn:"",an:""};
      if(isP(r[sess])) cnt++;
    });
    return cnt;
  }

  // Build day headers
  const dayHeaders = days.map(d=>dayTh(d)).join("");

  // Build student rows
  const studentRows = students.map((s,idx)=>{
    const ms=monthStats(s.id);
    const cs=cumStats(s.id);
    const cl=clCount(s.id); const ml=mlCount(s.id);
    const pct=cs.poss>0?Math.round(cs.pres/cs.poss*100):0;
    const pctColor=pct<PCT_WARN?"#c00":pct<PCT_WARN+5?"#b45309":"#166534";
    const clElig=Math.max(0,CL_ELIGIBLE-cl);

    const cells=days.map(d=>{
      const dt=new Date(year,month,d); const isSun=dt.getDay()===0;
      const isHol=!!S.holidays[dk(d)];
      const bg=isSun?"background:#fff0f0":isHol?"background:#fff3e0":"";
      if(isSun) return `<td style="${bg};border:1px solid #000;text-align:center;font-size:8px;color:#999">-</td>`;
      if(isHol) return `<td style="${bg};border:1px solid #000;text-align:center;font-size:8px;color:#e65100;font-weight:700">H</td>`;
      const r=(S.attendance[dk(d)]||{})[s.id]||{fn:"",an:""};
      const{t,c}=cellMark(r.fn,r.an);
      return `<td style="border:1px solid #000;text-align:center;font-size:9px;font-weight:900;color:${c}">${t}</td>`;
    }).join("");

function bindPageEvents(){
  const c=document.getElementById("page-content");
  if(!c) return;
  c.addEventListener("change",handleChange);
  c.addEventListener("click",handleClick);
  const ms=document.getElementById("modal-slot");
  if(ms){ms.addEventListener("click",handleClick);}
  // Settings signout
  const so=document.getElementById("btn-signout");
  if(so) so.addEventListener("click",()=>{
    if(confirm("Sign out? You will need to sign in again on this device.")) signOut(auth);
  });
}

function handleChange(e){
  const t=e.target;
  if(t.id==="batch-filter"){S.studFilter=t.value;refreshPage();}
  else if(t.id==="att-batch"){S.attState.batchId=t.value;localStorage.setItem('iti_default_batch',t.value);loadAttPageData();}
  else if(t.id==="att-month"){S.attState.month=parseInt(t.value);loadAttPageData();}
  else if(t.id==="att-year"){S.attState.year=parseInt(t.value)||TODAY.getFullYear();loadAttPageData();}
  else if(t.id==="att-day"){S.attState.day=parseInt(t.value);refreshPage();}
  else if(t.id==="rep-batch"){S.monthRep.batchId=t.value;}
  else if(t.id==="rep-month"){S.monthRep.month=parseInt(t.value);}
  else if(t.id==="rep-year"){S.monthRep.year=parseInt(t.value)||TODAY.getFullYear();}
  else if(t.id==="hr-batch"){S.hrState.batchId=t.value;}
  else if(t.id==="hr-h1s"){S.hrState.h1s=t.value;}
  else if(t.id==="hr-h1e"){S.hrState.h1e=t.value;}
  else if(t.id==="hr-h2s"){S.hrState.h2s=t.value;}
  else if(t.id==="hr-h2e"){S.hrState.h2e=t.value;}
  // Print detail fields — monthly
  else if(t.id==="pd-name"){S.printDetails.name=t.value;}
  else if(t.id==="pd-pos"){S.printDetails.position=t.value;}
  else if(t.id==="pd-trade"){S.printDetails.trade=t.value;}
  else if(t.id==="pd-date"){S.printDetails.printDate=t.checked;}
  else if(t.id==="pd-sf"){S.printDetails.includeSF=t.checked;}
  // Print detail fields — halfyear
  else if(t.id==="hr-pd-name"){S.printDetails.name=t.value;}
  else if(t.id==="hr-pd-pos"){S.printDetails.position=t.value;}
  else if(t.id==="hr-pd-trade"){S.printDetails.trade=t.value;}
  else if(t.id==="hr-pd-date"){S.printDetails.printDate=t.checked;}
  else if(t.id==="hr-pd-sf"){S.printDetails.includeSF=t.checked;}
  // Shopfloor filters
  else if(t.id==="sf-batch"){sfState.batchId=t.value;refreshPage();}
  else if(t.id==="sf-month"){sfState.month=parseInt(t.value);loadShopfloorData();}
  else if(t.id==="sf-year"){sfState.year=parseInt(t.value)||TODAY.getFullYear();loadShopfloorData();}
  else if(t.id==="sf-day"){sfState.day=parseInt(t.value);refreshPage();}
  // Attendance book filters
  else if(t.id==="ab-batch"){attBookState.batchId=t.value;refreshPage();}
  else if(t.id==="ab-month"){attBookState.month=parseInt(t.value);loadAttBookData();}
  else if(t.id==="ab-year"){attBookState.year=parseInt(t.value)||TODAY.getFullYear();loadAttBookData();}
  // Attendance book print details
  else if(t.id==="ab-pd-name"){S.printDetails.name=t.value;}
  else if(t.id==="ab-pd-pos"){S.printDetails.position=t.value;}
  else if(t.id==="ab-pd-trade"){S.printDetails.trade=t.value;}
  else if(t.id==="ab-pd-date"){S.printDetails.printDate=t.checked;}
}

async function loadAttPageData(){
  setLoading(true);
  try{
    await Promise.all([loadStudents(), loadAttendanceMonth(S.attState.year,S.attState.month)]);
    await syncAcdMarks(); // pull ACD marks into real attendance
    if(!S.attState.batchId&&S.batches.length){
      const saved=localStorage.getItem('iti_default_batch');
      S.attState.batchId=(saved&&S.batches.find(b=>b.id===saved))?saved:S.batches[0].id;
    }
    refreshPage();
  }catch(e){toast(e.message,"error");refreshPage();}
  finally{setLoading(false);}
}

async function loadStudentsPageData(){
  setLoading(true);
  try{ await loadStudents(); refreshPage(); }

    return;

    }

    try{
      const id=editingId||uid();
      const student={id,adm,name:nm,batchId:bid};

    finally{setLoading(false);}

          await deleteStudentFS(sid);

        finally{setLoading(false);}
      }
