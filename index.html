<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITI Attendance System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;--surface:#fff;--surface2:#f8f9fb;
  --border:#e2e6ea;--border2:#cdd3da;
  --text:#1a202c;--text2:#4a5568;--text3:#718096;
  --accent:#2563eb;--accent-bg:#eff6ff;--accent-border:#bfdbfe;
  --success:#16a34a;--success-bg:#f0fdf4;--success-border:#bbf7d0;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-border:#fde68a;
  --danger:#dc2626;--danger-bg:#fef2f2;--danger-border:#fecaca;
  --radius:8px;--radius2:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
h1{font-size:20px;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:14px;font-weight:600}
button{cursor:pointer;font-family:inherit;font-size:13px;transition:all .15s}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font-family:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 10px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border-radius:var(--radius);border:none;font-weight:500}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:var(--surface);border:1px solid var(--border2);color:var(--text2)}.btn-secondary:hover{background:var(--surface2)}
.btn-danger{background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger)}
.btn-success{background:var(--success-bg);border:1px solid var(--success-border);color:var(--success)}
.btn-google{background:#fff;border:1px solid var(--border2);color:var(--text);display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;width:100%;justify-content:center}
.btn-google:hover{background:var(--surface2);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{background:none;border:none;padding:4px 6px;border-radius:4px;color:var(--text3)}.btn-icon:hover{background:var(--surface2);color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);box-shadow:var(--shadow)}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-body{padding:16px 18px}
.flex{display:flex;align-items:center;gap:8px}
.flex-end{justify-content:flex-end}
.flex-between{justify-content:space-between}
.flex-wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.p0{padding:0}
.text-sm{font-size:12px}.text-xs{font-size:11px}
.text-muted{color:var(--text3)}.text-secondary{color:var(--text2)}
.text-danger{color:var(--danger)}.text-warn{color:var(--warn)}.text-success{color:var(--success)}.text-accent{color:var(--accent)}
.fw500{font-weight:500}.fw600{font-weight:600}
table{width:100%;border-collapse:collapse}
th{background:var(--surface2);padding:9px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-accent{background:var(--accent-bg);color:var(--accent)}
/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:14px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo .inst{font-size:11px;color:var(--text3);margin-top:1px;line-height:1.3}
.sidebar-logo .user{font-size:12px;color:var(--accent);font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{flex:1;padding:8px 6px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--radius);border:none;background:none;width:100%;text-align:left;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.nav-sep{height:1px;background:var(--border);margin:6px 4px}
.sidebar-footer{padding:10px 8px;border-top:1px solid var(--border)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:20px}
/* Stat cards */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px}
.stat-val{font-size:26px;font-weight:700;line-height:1.1}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
/* Attendance */
.att-table th,.att-table td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px}
.att-table th{font-size:11px;font-weight:600;color:var(--text2);background:var(--surface2)}
.sess-group{display:flex;gap:3px;align-items:center}
.sess-label{font-size:10px;color:var(--text3);font-weight:600;width:18px}
.sess-btn{padding:4px 7px;border-radius:4px;border:1px solid var(--border2);font-size:11px;font-weight:600;background:var(--surface2);color:var(--text3);cursor:pointer;transition:all .1s;min-width:32px;text-align:center}
.sess-btn.P{background:#dcfce7;color:#15803d;border-color:#86efac}
.sess-btn.A{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.sess-btn.CL{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.sess-btn.ML{background:#fef3c7;color:#b45309;border-color:#fcd34d}
.att-footer{padding:10px 12px;background:var(--surface2);border-top:1px solid var(--border);display:flex;gap:20px;flex-wrap:wrap;font-size:12px}
/* Login screen */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#eff6ff 0%,#f0fdf4 100%)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.login-logo{font-size:48px;margin-bottom:16px}
/* PIN screen */
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg)}
.pin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:20px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto}
.pin-key{padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-size:18px;font-weight:500;cursor:pointer;text-align:center;transition:all .1s}
.pin-key:hover{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent)}
.pin-key:active{transform:scale(.95)}
/* Profile setup */
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:480px;box-shadow:var(--shadow)}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:18px 20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:400;padding:12px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:slideUp .25s ease}
.toast-success{background:#16a34a;color:#fff}
.toast-error{background:#dc2626;color:#fff}
.toast-info{background:#2563eb;color:#fff}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Loading */
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay p{font-size:13px;color:var(--text2)}
/* Report */
.report-table th,.report-table td{padding:6px 10px;font-size:12px;text-align:center}
.report-table td:nth-child(3){text-align:left}
.report-table th:nth-child(3){text-align:left}
.report-title{padding:14px 18px;background:var(--surface2);border-bottom:1px solid var(--border)}
.pct-critical{color:var(--danger);font-weight:600}
.pct-warn{color:var(--warn);font-weight:600}
.pct-ok{color:var(--success);font-weight:600}
/* User avatar */
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}
.avatar-initials{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--accent-border)}
/* Sync indicator */
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Print */
@media print{
  body{background:#fff!important;font-size:12px}
  .no-print{display:none!important}
  .app{display:block;height:auto;overflow:visible}
  .sidebar{display:none!important}
  .main{display:block;overflow:visible}
  .topbar{display:none!important}
  .content{padding:0;overflow:visible}
  .card{box-shadow:none!important;border:none!important}
  .print-table{width:100%;border-collapse:collapse;font-size:11px}
  .print-table th{background:#e0e0e0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border:1px solid #888;padding:5px 6px;font-size:10px;font-weight:700;text-align:center}
  .print-table td{border:1px solid #bbb;padding:4px 6px;text-align:center}
  .print-table td.name-col{text-align:left}
  .print-table tr:nth-child(even) td{background:#f5f5f5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:15mm 12mm;size:A4 portrait}
}
@media(max-width:640px){
  .sidebar{width:52px}
  .sidebar-logo .title,.sidebar-logo .inst,.sidebar-logo .user{display:none}
  .nav-item span{display:none}.nav-item{justify-content:center}
  .grid4{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"><div class="loading-overlay"><div class="spinner"></div><p>Loading...</p></div></div>
<div id="modal-slot"></div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
         collection, getDocs, writeBatch, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ============================================================
// FIREBASE CONFIG
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBDp77-c1-W90NbN7JaHeON0lGdmw_a4rE",
  authDomain: "iti-attandance.firebaseapp.com",
  projectId: "iti-attandance",
  storageBucket: "iti-attandance.firebasestorage.app",
  messagingSenderId: "696177559857",
  appId: "1:696177559857:web:97e6ab2fc4fb7c6cfac810",
  measurementId: "G-HGLFQ6FT99"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ============================================================
// CONSTANTS
// ============================================================
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const SESS = ["P","A","CL","ML"];
const SESS_LABEL = { P:"Present", A:"Absent", CL:"Casual Leave", ML:"Medical Leave" };
const PCT_WARN = 80;
const TODAY = new Date();

// ============================================================
// STATE
// ============================================================
let S = {
  user: null,           // Firebase user
  profile: null,        // { name, institute, pinHash }
  isUnlocked: false,
  batches: [],
  students: [],
  attendance: {},       // { dateKey: { studentId: {fn,an} } }
  page: "dashboard",
  attState: { batchId:"", year:TODAY.getFullYear(), month:TODAY.getMonth(), day:TODAY.getDate() },
  studFilter: "all",
  monthRep: { batchId:"", year:TODAY.getFullYear(), month:TODAY.getMonth() },
  hrState: { batchId:"", h1s:"", h1e:"", h2s:"", h2e:"" },
  syncStatus: "ok",     // ok | syncing | error
};

let lastMonthlyData=null, lastMonthlyMeta=null;
let lastHRData=null, lastHRMeta=null;

// ============================================================
// FIRESTORE HELPERS — data lives under /instructors/{uid}/...
// ============================================================
const userPath = () => `instructors/${S.user.uid}`;
const profileRef   = () => doc(db, userPath(), "_meta", "config", "profile");
const batchesRef   = () => collection(db, userPath(), "batches");
const batchRef     = (id) => doc(db, userPath(), "batches", id);
const studentsRef  = () => collection(db, userPath(), "students");
const studentRef   = (id) => doc(db, userPath(), "students", id);
const attRef       = (dk) => doc(db, userPath(), "attendance", dk);
const attColRef    = () => collection(db, userPath(), "attendance");

// ============================================================
// PIN HASH (SHA-256)
// ============================================================
async function hashPin(pin) {
  const raw = "ITI_ATT_" + pin + "_SALT_2025";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ============================================================
// FIRESTORE OPS
// ============================================================
async function saveProfile(data) {
  const ref = doc(db, `instructors/${S.user.uid}/_meta/profile`);
  await setDoc(ref, data);
  S.profile = data;
}

async function loadProfile() {
  const ref = doc(db, `instructors/${S.user.uid}/_meta/profile`);
  const snap = await getDoc(ref);
  return snap.exists() ? snap.data() : null;
}

async function loadBatches() {
  const snap = await getDocs(batchesRef());
  S.batches = snap.docs.map(d=>({id:d.id,...d.data()}));
  S.batches.sort((a,b)=>a.name.localeCompare(b.name));
}

async function saveBatchFS(batch) {
  setSyncStatus("syncing");
  await setDoc(batchRef(batch.id), batch);
  setSyncStatus("ok");
}

async function deleteBatchFS(id) {
  setSyncStatus("syncing");
  await deleteDoc(batchRef(id));
  // delete students in batch
  const snap = await getDocs(query(studentsRef(), where("batchId","==",id)));
  const batch2 = writeBatch(db);
  snap.docs.forEach(d => batch2.delete(d.ref));
  await batch2.commit();
  setSyncStatus("ok");
}

async function loadStudents() {
  const snap = await getDocs(studentsRef());
  S.students = snap.docs.map(d=>({id:d.id,...d.data()}));
  S.students.sort((a,b)=>a.name.localeCompare(b.name));
}

async function saveStudentFS(student) {
  setSyncStatus("syncing");
  await setDoc(studentRef(student.id), student);
  setSyncStatus("ok");
}

async function deleteStudentFS(id) {
  setSyncStatus("syncing");
  await deleteDoc(studentRef(id));
  setSyncStatus("ok");
}

async function loadAttendanceMonth(year, month) {
  const from = `${year}-${pad(month+1)}-01`;
  const to   = `${year}-${pad(month+1)}-${pad(daysInMonth(year,month))}`;
  // Firestore doesn't support __name__ range queries — fetch all and filter client-side
  const snap = await getDocs(attColRef());
  snap.docs.forEach(d => {
    if (d.id >= from && d.id <= to) S.attendance[d.id] = d.data();
  });
}

async function saveAttendanceFS(dk, sid, fn, an) {
  setSyncStatus("syncing");
  try {
    const ref = attRef(dk);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      await updateDoc(ref, { [sid]: {fn, an}, _updated: Date.now() });
    } else {
      await setDoc(ref, { [sid]: {fn, an}, _updated: Date.now() });
    }
    setSyncStatus("ok");
  } catch(e) { setSyncStatus("error"); throw e; }
}

async function markAllFS(dk, studentIds, fn, an) {
  setSyncStatus("syncing");
  try {
    const ref = attRef(dk);
    const updates = { _updated: Date.now() };
    studentIds.forEach(sid => updates[sid] = {fn, an});
    const snap = await getDoc(ref);
    if (snap.exists()) {
      await updateDoc(ref, updates);
    } else {
      await setDoc(ref, updates);
    }
    setSyncStatus("ok");
  } catch(e) { setSyncStatus("error"); throw e; }
}

// ============================================================
// REPORT CALCULATIONS (client-side from cached S.attendance)
// ============================================================
function calcMonthlyReport(batchId, year, month) {
  const students = S.students.filter(s=>s.batchId===batchId);
  const firstDay = `${year}-${pad(month+1)}-01`;
  const lastDay  = `${year}-${pad(month+1)}-${pad(daysInMonth(year,month))}`;

  return students.map(s => {
    let mPoss=0,mPres=0,cumPoss=0,cumPres=0;
    for (const [dk,rec] of Object.entries(S.attendance)) {
      if (!rec[s.id]) continue;
      const r = rec[s.id];
      if (!r.fn && !r.an) continue;
      const poss = (r.fn?0.5:0)+(r.an?0.5:0);
      const pres = (r.fn==="P"?0.5:0)+(r.an==="P"?0.5:0);
      if (dk >= firstDay && dk <= lastDay) { mPoss+=poss; mPres+=pres; }
      if (dk <= lastDay) { cumPoss+=poss; cumPres+=pres; }
    }
    return {
      id:s.id, adm:s.adm, name:s.name,
      monthPoss:mPoss, monthPres:mPres,
      cumPoss, cumPres,
      pct: cumPoss>0 ? Math.round(cumPres/cumPoss*100) : 0
    };
  });
}

async function loadAttendanceRange(from, to) {
  // Fetch all attendance docs and filter client-side (Firestore __name__ range not supported)
  const snap = await getDocs(attColRef());
  snap.docs.forEach(d => {
    if (d.id >= from && d.id <= to) S.attendance[d.id] = d.data();
  });
}

async function loadAllAttendance() {
  // Load every attendance document for this instructor — filter client-side
  const snap = await getDocs(attColRef());
  snap.docs.forEach(d => { S.attendance[d.id] = d.data(); });
}

function calcHalfYearReport(batchId, h1s, h1e, h2s, h2e) {
  const students = S.students.filter(s=>s.batchId===batchId);
  return students.map(s => {
    let h1Poss=0,h1Pres=0,h2Poss=0,h2Pres=0;
    for (const [dk,rec] of Object.entries(S.attendance)) {
      if (!rec[s.id]) continue;
      const r = rec[s.id];
      if (!r.fn && !r.an) continue;
      const poss = (r.fn?0.5:0)+(r.an?0.5:0);
      const pres = (r.fn==="P"?0.5:0)+(r.an==="P"?0.5:0);
      if (dk>=h1s&&dk<=h1e){ h1Poss+=poss; h1Pres+=pres; }
      if (dk>=h2s&&dk<=h2e){ h2Poss+=poss; h2Pres+=pres; }
    }
    return {
      id:s.id, adm:s.adm, name:s.name,
      h1Poss,h1Pres, h1Pct:h1Poss>0?Math.round(h1Pres/h1Poss*100):0,
      h2Poss,h2Pres, h2Pct:h2Poss>0?Math.round(h2Pres/h2Poss*100):0
    };
  });
}

// ============================================================
// UTILITIES
// ============================================================
function uid(){ return crypto.randomUUID().replace(/-/g,"").substring(0,12); }
function pad(n){ return String(n).padStart(2,"0"); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function fmtDate(d){ const dt=d instanceof Date?d:new Date(d); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function setSyncStatus(s){ S.syncStatus=s; const el=document.getElementById("sync-dot"); if(el){el.className="sync-dot"+(s!=="ok"?" "+s:"");el.title=s==="ok"?"Saved":s==="syncing"?"Saving...":"Save error";} }

function toast(msg,type="success"){
  const el=document.createElement("div");
  el.className=`toast toast-${type}`;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
function setLoading(v,msg=""){
  let ov=document.getElementById("loading-overlay");
  if(v&&!ov){
    ov=document.createElement("div");
    ov.id="loading-overlay";
    ov.className="loading-overlay";
    ov.innerHTML=`<div class="spinner"></div>${msg?`<p>${msg}</p>`:""}`;
    document.body.appendChild(ov);
  }else if(!v&&ov){ ov.remove(); }
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    S.user = user;
    setLoading(true,"Loading your data...");
    try {
      S.profile = await loadProfile();
      if (!S.profile) {
        // First time — show profile setup
        setLoading(false);
        renderProfileSetup();
        return;
      }
      // Has profile — show PIN screen
      setLoading(false);
      renderPin("");
    } catch(e) {
      setLoading(false);
      toast("Error loading profile: "+e.message,"error");
      renderLogin();
    }
  } else {
    S.user = null;
    S.profile = null;
    S.isUnlocked = false;
    renderLogin();
  }
});

let pinBuffer="", pinError=false;

function renderPin(errorMsg){
  const p = S.profile||{};
  const u = S.user;
  document.getElementById("root").innerHTML=`
<div class="pin-screen">
  <div class="pin-card">
    <div style="text-align:center;margin-bottom:4px">
      ${u&&u.photoURL?`<img src="${u.photoURL}" class="avatar" style="width:52px;height:52px;margin:0 auto 10px;display:block">`:`<div style="font-size:36px;margin-bottom:10px">🔐</div>`}
      <h2>${p.name||"ITI Attendance"}</h2>
      <p class="text-sm text-muted">${p.institute||"Govt ITI Dhanuvachapuram"}</p>
      <p class="text-xs text-muted">${u?u.email:""}</p>
    </div>
    <p class="text-sm text-secondary" style="text-align:center;margin:14px 0 4px">Enter 4-digit PIN</p>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div>
      <div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    ${errorMsg?`<p class="text-sm text-danger" style="text-align:center;margin-bottom:8px">${errorMsg}</p>`:""}
    <div class="pin-keypad">
      ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>
        k===""?`<div></div>`:`<button class="pin-key" data-key="${k}">${k}</button>`
      ).join("")}
    </div>
    <button class="btn btn-secondary btn-sm" id="btn-signout-pin" style="width:100%;margin-top:16px;font-size:12px">Sign out</button>
  </div>
</div>`;
  pinBuffer=""; pinError=false;
  document.querySelectorAll(".pin-key").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const k=btn.dataset.key;
      if(k==="⌫") pinBuffer=pinBuffer.slice(0,-1);
      else if(pinBuffer.length<4) pinBuffer+=k;
      updatePinDots();
      if(pinBuffer.length===4) submitPin();
    });
  });
  document.getElementById("btn-signout-pin").addEventListener("click",()=>signOut(auth));
  document.onkeydown=e=>{
    if(/^\d$/.test(e.key)&&pinBuffer.length<4){pinBuffer+=e.key;updatePinDots();if(pinBuffer.length===4)submitPin();}
    if(e.key==="Backspace"){pinBuffer=pinBuffer.slice(0,-1);updatePinDots();}
  };
}

function updatePinDots(){
  document.querySelectorAll(".pin-dot").forEach((d,i)=>{
    d.classList.toggle("filled",i<pinBuffer.length);
    d.classList.toggle("error",pinError);
  });
}

async function submitPin(){
  const attempt=pinBuffer;
  const hash=await hashPin(attempt);
  if(hash===S.profile.pinHash){
    document.onkeydown=null;
    S.isUnlocked=true;
    setLoading(true,"Loading attendance data...");
    try{
      await loadAll();
      renderApp();
    }catch(e){ toast("Load error: "+e.message,"error"); }
    finally{ setLoading(false); }
  } else {
    pinError=true;
    updatePinDots();
    setTimeout(()=>{
      pinBuffer=""; pinError=false;
      renderPin("Incorrect PIN. Try again.");
    },700);
  }
}

async function loadAll(){
  await Promise.all([loadBatches(), loadStudents()]);

  // Set defaults
  if(!S.attState.batchId&&S.batches.length) S.attState.batchId=S.batches[0].id;
  if(!S.monthRep.batchId&&S.batches.length) S.monthRep.batchId=S.batches[0].id;
  if(!S.hrState.batchId&&S.batches.length)  S.hrState.batchId=S.batches[0].id;
  const y=TODAY.getFullYear();
  if(!S.hrState.h1s){S.hrState.h1s=`${y}-06-01`;S.hrState.h1e=`${y}-11-30`;S.hrState.h2s=`${y}-12-01`;S.hrState.h2e=`${y+1}-05-31`;}
}

function refreshPage(){

  document.getElementById("page-content").innerHTML=renderPage();
  bindPageEvents();
}

    case"monthly":   return renderMonthly();

    case"settings":  return renderSettings();
    default: return "";
  }
}

function renderDashboard(){
  const totalSt=S.students.length, totalB=S.batches.length;
  const dk=fmtDate(TODAY);
  const todayAtt=S.attendance[dk]||{};
  const markedToday=Object.keys(todayAtt).filter(k=>k!=="__updated"&&k!=="__name__"&&k!=="_updated").length;
  let below80=0;
  for(const s of S.students){
    let poss=0,pres=0;
    for(const rec of Object.values(S.attendance)){
      if(!rec[s.id])continue;
      const r=rec[s.id];
      if(r.fn)poss+=0.5; if(r.an)poss+=0.5;
      if(r.fn==="P")pres+=0.5; if(r.an==="P")pres+=0.5;
    }
    if(poss>0&&Math.round(pres/poss*100)<PCT_WARN)below80++;
  }
  const batchRows=S.batches.map(b=>{
    const cnt=S.students.filter(s=>s.batchId===b.id).length;
    return`<tr><td class="fw500">${b.name}</td><td>${b.trade}</td><td>${b.year}</td><td>${cnt}</td></tr>`;
  }).join("")||`<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text3)">No batches yet</td></tr>`;
  return`
<div class="grid4 mb20">
  <div class="stat-card"><div class="stat-val text-accent">${totalB}</div><div class="stat-lbl">Batches</div></div>
  <div class="stat-card"><div class="stat-val">${totalSt}</div><div class="stat-lbl">Students</div></div>
  <div class="stat-card"><div class="stat-val text-success">${markedToday}</div><div class="stat-lbl">Marked today</div></div>
  <div class="stat-card"><div class="stat-val text-danger">${below80}</div><div class="stat-lbl">Below ${PCT_WARN}%</div></div>
</div>
<div class="card mb16">
  <div class="card-header flex-between"><h3>Batches</h3><button class="btn btn-secondary btn-sm" data-action="go-batches">Manage</button></div>
  <div class="p0"><table>${batchRows}</table></div>
</div>
<div class="card">
  <div class="card-header"><h3>Quick actions</h3></div>
  <div class="card-body flex flex-wrap" style="gap:8px">
    <button class="btn btn-primary" data-action="go-attendance">✅ Mark attendance</button>
    <button class="btn btn-secondary" data-action="go-students">👥 Add students</button>
    <button class="btn btn-secondary" data-action="go-monthly">📋 Monthly report</button>
    <button class="btn btn-secondary" data-action="go-halfyear">📈 H1/H2 report</button>
  </div>
</div>`;
}

function renderAttendance(){
  const{batchId,year,month,day}=S.attState;
  const maxDay=daysInMonth(year,month);
  const d=Math.min(day,maxDay);
  const dk=`${year}-${pad(month+1)}-${pad(d)}`;
  const students=S.students.filter(s=>s.batchId===batchId);
  const bOpts=S.batches.map(b=>`<option value="${b.id}"${batchId===b.id?" selected":""}>${b.name}</option>`).join("");
  const mOpts=MONTHS.map((m,i)=>`<option value="${i}"${month===i?" selected":""}>${m}</option>`).join("");
  const dOpts=Array.from({length:maxDay},(_,i)=>`<option value="${i+1}"${d===i+1?" selected":""}>${i+1}</option>`).join("");
  let fnP=0,anP=0,full=0;
  const rows=students.map((s,idx)=>{
    const att=(S.attendance[dk]||{})[s.id]||{fn:"",an:""};
    if(att.fn==="P")fnP++; if(att.an==="P")anP++; if(att.fn==="P"&&att.an==="P")full++;
    const fnBtns=SESS.map(v=>`<button class="sess-btn ${att.fn===v?v:""}" data-action="mark-sess" data-sid="${s.id}" data-dk="${dk}" data-sess="fn" data-val="${v}">${v}</button>`).join("");
    const anBtns=SESS.map(v=>`<button class="sess-btn ${att.an===v?v:""}" data-action="mark-sess" data-sid="${s.id}" data-dk="${dk}" data-sess="an" data-val="${v}">${v}</button>`).join("");
    return`<tr>
      <td style="color:var(--text3);font-size:12px">${idx+1}</td>
      <td style="font-size:12px;color:var(--text3)">${s.adm}</td>
      <td class="fw500">${s.name}</td>
      <td><div class="sess-group"><span class="sess-label">FN</span>${fnBtns}</div></td>
      <td><div class="sess-group"><span class="sess-label">AN</span>${anBtns}</div></td>
      <td><button class="btn btn-secondary btn-sm" data-action="mark-both" data-sid="${s.id}" data-dk="${dk}" data-fn="${att.fn}" data-an="${att.an}">Both</button></td>
    </tr>`;
  }).join("");
  return`
<div class="card mb16">
  <div class="card-body">

// EVENT BINDING
// ============================================================
function bindPageEvents(){
  const c=document.getElementById("page-content");
  if(!c) return;
  c.addEventListener("change",handleChange);
  c.addEventListener("click",handleClick);
  const ms=document.getElementById("modal-slot");
  if(ms){ms.addEventListener("click",handleClick);}
  // Settings signout
  const so=document.getElementById("btn-signout");
  if(so) so.addEventListener("click",()=>signOut(auth));
}

function handleChange(e){
  const t=e.target;
  if(t.id==="batch-filter"){S.studFilter=t.value;refreshPage();}
  else if(t.id==="att-batch"){S.attState.batchId=t.value;loadAttPageData();}
  else if(t.id==="att-month"){S.attState.month=parseInt(t.value);loadAttPageData();}
  else if(t.id==="att-year"){S.attState.year=parseInt(t.value)||TODAY.getFullYear();loadAttPageData();}
  else if(t.id==="att-day"){S.attState.day=parseInt(t.value);refreshPage();}
  else if(t.id==="rep-batch"){S.monthRep.batchId=t.value;}
  else if(t.id==="rep-month"){S.monthRep.month=parseInt(t.value);}
  else if(t.id==="rep-year"){S.monthRep.year=parseInt(t.value)||TODAY.getFullYear();}
  else if(t.id==="hr-batch"){S.hrState.batchId=t.value;}
  else if(t.id==="hr-h1s"){S.hrState.h1s=t.value;}
  else if(t.id==="hr-h1e"){S.hrState.h1e=t.value;}
  else if(t.id==="hr-h2s"){S.hrState.h2s=t.value;}
  else if(t.id==="hr-h2e"){S.hrState.h2e=t.value;}
}

async function loadAttPageData(){
  setLoading(true);
  try{
    await Promise.all([loadStudents(), loadAttendanceMonth(S.attState.year,S.attState.month)]);
    if(!S.attState.batchId&&S.batches.length) S.attState.batchId=S.batches[0].id;
    refreshPage();
  }catch(e){toast(e.message,"error");refreshPage();}
  finally{setLoading(false);}
}

async function loadStudentsPageData(){
  setLoading(true);
  try{ await loadStudents(); refreshPage(); }
  catch(e){toast(e.message,"error");refreshPage();}
  finally{setLoading(false);}
}

async function handleClick(e){
  const btn=e.target.closest("[data-action]");
  if(!btn) return;
  const a=btn.dataset.action;

  if(a==="go-batches")   {S.page="batches";   refreshPage();return;}
  if(a==="go-students")  {S.page="students";  loadStudentsPageData();return;}
  if(a==="go-attendance"){S.page="attendance"; loadAttPageData();return;}
  if(a==="go-monthly")   {S.page="monthly";   refreshPage();return;}
  if(a==="go-halfyear")  {S.page="halfyear";  refreshPage();return;}

  // Batch CRUD
  if(a==="add-batch")  {batchModal("");return;}
  if(a==="edit-batch") {batchModal(btn.dataset.id);return;}
  if(a==="save-batch") {
    const nm=document.getElementById("m-bname").value.trim();
    const tr=document.getElementById("m-btrade").value.trim();
    const yr=document.getElementById("m-byear").value.trim();
    if(!nm){toast("Batch name required","error");return;}
    setLoading(true);
    try{
      const id=btn.dataset.id||uid();
      const batch={id,name:nm,trade:tr,year:yr};
      await saveBatchFS(batch);
      if(!btn.dataset.id) S.batches.push(batch);
      else{const b=S.batches.find(x=>x.id===btn.dataset.id);if(b){b.name=nm;b.trade=tr;b.year=yr;}}
      S.batches.sort((a,b)=>a.name.localeCompare(b.name));
      closeModal();refreshPage();toast("Batch saved");
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false);}
    return;
  }
  if(a==="del-batch"){
    if(!confirm("Delete this batch and all its students?"))return;
    setLoading(true);
    try{
      await deleteBatchFS(btn.dataset.id);
      S.batches=S.batches.filter(b=>b.id!==btn.dataset.id);
      S.students=S.students.filter(s=>s.batchId!==btn.dataset.id);
      refreshPage();toast("Batch deleted");
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false);}
    return;
  }

  // Student CRUD
  if(a==="add-student")  {studentModal("");return;}
  if(a==="edit-student") {studentModal(btn.dataset.id);return;}
  if(a==="save-student") {
    const adm=document.getElementById("m-sadm").value.trim();
    const nm=document.getElementById("m-sname").value.trim().toUpperCase();
    const bid=document.getElementById("m-sbatch").value;
    if(!nm||!bid){toast("Name and batch required","error");return;}
    setLoading(true);
    try{
      const id=btn.dataset.id||uid();
      const student={id,adm,name:nm,batchId:bid};
      await saveStudentFS(student);
      if(!btn.dataset.id) S.students.push(student);
      else{const s=S.students.find(x=>x.id===btn.dataset.id);if(s){s.adm=adm;s.name=nm;s.batchId=bid;}}
      S.students.sort((a,b)=>a.name.localeCompare(b.name));
      closeModal();refreshPage();toast("Student saved");
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false);}
    return;
  }
  if(a==="del-student"){
    if(!confirm("Remove this student?"))return;
    setLoading(true);
    try{
      await deleteStudentFS(btn.dataset.id);
      S.students=S.students.filter(s=>s.id!==btn.dataset.id);
      refreshPage();toast("Student removed");
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false);}
    return;
  }

  // Attendance marking — optimistic UI + background save
  if(a==="mark-sess"){
    const{sid,dk,sess,val}=btn.dataset;
    const cur=(S.attendance[dk]||{})[sid]||{fn:"",an:""};
    const fn=sess==="fn"?val:cur.fn;
    const an=sess==="an"?val:cur.an;
    if(!S.attendance[dk])S.attendance[dk]={};
    S.attendance[dk][sid]={fn,an};
    refreshPage();
    saveAttendanceFS(dk,sid,fn,an).catch(e=>toast("Save error: "+e.message,"error"));
    return;
  }
  if(a==="mark-both"){bothModal(btn.dataset.sid,btn.dataset.dk,btn.dataset.fn,btn.dataset.an);return;}
  if(a==="mark-both-val"){
    const{sid,dk,val}=btn.dataset;
    if(!S.attendance[dk])S.attendance[dk]={};
    S.attendance[dk][sid]={fn:val,an:val};
    closeModal();refreshPage();
    saveAttendanceFS(dk,sid,val,val).catch(e=>toast("Save error: "+e.message,"error"));
    return;
  }
  if(a==="mark-all-present"||a==="mark-all-absent"){
    const v=a==="mark-all-present"?"P":"A";
    const{batchId,year,month,day}=S.attState;
    const d=Math.min(day,daysInMonth(year,month));
    const dk=`${year}-${pad(month+1)}-${pad(d)}`;
    const students=S.students.filter(s=>s.batchId===batchId);
    if(!S.attendance[dk])S.attendance[dk]={};
    students.forEach(s=>S.attendance[dk][s.id]={fn:v,an:v});
    refreshPage();
    markAllFS(dk,students.map(s=>s.id),v,v).catch(e=>toast("Save error: "+e.message,"error"));
    return;
  }

  // Reports
  if(a==="load-monthly"){
    setLoading(true,"Generating report...");
    try{
      // Load all attendance docs at once for accurate cumulative totals
      await loadAllAttendance();
      const data=calcMonthlyReport(S.monthRep.batchId,S.monthRep.year,S.monthRep.month);
      const b=S.batches.find(x=>x.id===S.monthRep.batchId);
      lastMonthlyData=data; lastMonthlyMeta={batch:b,month:S.monthRep.month,year:S.monthRep.year};
      const rows=data.map((s,i)=>{
        const pctCls=s.pct<PCT_WARN?"pct-critical":s.pct<PCT_WARN+5?"pct-warn":"pct-ok";
        const remark=s.pct<PCT_WARN?"Short attendance":"";
        return`<tr><td>${i+1}</td><td>${s.adm}</td><td class="fw500" style="text-align:left">${s.name}</td>
        <td>${s.monthPoss}</td><td>${s.monthPres}</td><td>${s.cumPoss}</td><td>${s.cumPres}</td>
        <td class="${pctCls}">${s.pct}%</td><td style="font-size:11px;color:var(--danger)">${remark}</td></tr>`;
      }).join("")||`<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text3)">No data.</td></tr>`;
      document.getElementById("monthly-result").innerHTML=`
<div class="report-title"><strong>${S.profile?.institute||"Govt ITI Dhanuvachapuram"}</strong>
<span class="text-sm text-muted" style="margin-left:10px">${b?b.name:""} &mdash; ${MONTHS[S.monthRep.month]} ${S.monthRep.year}</span></div>
<div style="overflow-x:auto"><table class="report-table"><thead><tr>
  <th>Sl</th><th>Adm No</th><th>Name</th>
  <th>Poss<br><small>(Month)</small></th><th>Present<br><small>(Month)</small></th>
  <th>Cum.<br>Possible</th><th>Cum.<br>Present</th><th>%</th><th>Remark</th>
</tr></thead><tbody>${rows}</tbody></table></div>`;
      const pb=document.getElementById("btn-print-monthly");
      if(pb)pb.disabled=false;
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false);}
    return;
  }
  if(a==="print-monthly"){printMonthlyReport();return;}

  if(a==="load-halfyear"){
    setLoading(true,"Calculating...");
    try{
      await loadAllAttendance();
      const data=calcHalfYearReport(S.hrState.batchId,S.hrState.h1s,S.hrState.h1e,S.hrState.h2s,S.hrState.h2e);
      const b=S.batches.find(x=>x.id===S.hrState.batchId);
      lastHRData=data; lastHRMeta={batch:b,...S.hrState};
      const rows=data.map((s,i)=>{
        const h1c=s.h1Pct<PCT_WARN?"pct-critical":s.h1Pct<PCT_WARN+5?"pct-warn":"pct-ok";
        const h2c=s.h2Pct<PCT_WARN?"pct-critical":s.h2Pct<PCT_WARN+5?"pct-warn":"pct-ok";
        return`<tr><td>${i+1}</td><td>${s.adm}</td><td class="fw500" style="text-align:left">${s.name}</td>
        <td>${s.h1Poss}</td><td>${s.h1Pres}</td><td class="${h1c}">${s.h1Pct}%</td>
        <td>${s.h2Poss}</td><td>${s.h2Pres}</td><td class="${h2c}">${s.h2Pct}%</td></tr>`;
      }).join("")||`<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text3)">No data.</td></tr>`;
      document.getElementById("hr-result").innerHTML=`
<div class="report-title"><strong>H1 / H2 Attendance Summary</strong>
<span class="text-sm text-muted" style="margin-left:10px">${b?b.name:""}</span></div>
<div style="overflow-x:auto"><table class="report-table"><thead>
  <tr><th rowspan="2">Sl</th><th rowspan="2">Adm No</th><th rowspan="2" style="text-align:left">Name</th>
  <th colspan="3" style="background:var(--accent-bg);color:var(--accent)">H1 (First Half)</th>
  <th colspan="3" style="background:var(--success-bg);color:var(--success)">H2 (Second Half)</th></tr>
  <tr><th style="background:var(--accent-bg)">Possible</th><th style="background:var(--accent-bg)">Present</th><th style="background:var(--accent-bg)">%</th>
  <th style="background:var(--success-bg)">Possible</th><th style="background:var(--success-bg)">Present</th><th style="background:var(--success-bg)">%</th></tr>
</thead><tbody>${rows}</tbody></table></div>`;
      const pb=document.getElementById("btn-print-halfyear");
      if(pb)pb.disabled=false;
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false);}
    return;
  }
  if(a==="print-halfyear"){printHalfYearReport();return;}

  // Settings
  if(a==="edit-profile"){
    const p=S.profile||{};
    showModal(`
<div class="modal-header"><h3>Edit profile</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
<div class="modal-body">
  <div class="form-group"><label class="form-label">Name</label><input id="ep-name" value="${p.name||""}"/></div>
  <div class="form-group"><label class="form-label">Institute</label><input id="ep-inst" value="${p.institute||""}"/></div>
  <div class="form-group"><label class="form-label">Trade</label><input id="ep-trade" value="${p.trade||""}"/></div>
</div>
<div class="modal-footer">
  <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
  <button class="btn btn-primary" data-action="save-profile">Save</button>
</div>`);
    return;
  }
  if(a==="save-profile"){
    const nm=document.getElementById("ep-name").value.trim();
    const inst=document.getElementById("ep-inst").value.trim();
    const trade=document.getElementById("ep-trade").value.trim();
    if(!nm){toast("Name required","error");return;}
    setLoading(true);
    try{
      await saveProfile({...S.profile,name:nm,institute:inst,trade});
      closeModal();refreshPage();toast("Profile updated");
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false);}
    return;
  }
  if(a==="change-pin"){
    const np=document.getElementById("new-pin")?.value.trim();
    const np2=document.getElementById("new-pin2")?.value.trim();
    if(!/^\d{4}$/.test(np)){toast("PIN must be 4 digits","error");return;}
    if(np!==np2){toast("PINs do not match","error");return;}
    setLoading(true);
    try{
      const pinHash=await hashPin(np);
      await saveProfile({...S.profile,pinHash});
      toast("PIN updated successfully");
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false);}
    return;
  }
}

// make closeModal global for inline onclick
window.closeModal = closeModal;
</script>
</body>
</html>
