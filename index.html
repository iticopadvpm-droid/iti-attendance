async function generateParentLink(mode) {
  const {batchId, year, month, day} = S.attState;
  const maxDay = daysInMonth(year, month);
  const d = Math.min(day, maxDay);
  const dk = `${year}-${pad(month+1)}-${pad(d)}`;
  const batch = S.batches.find(b=>b.id===batchId);
  const inst = S.profile?.institute || "Govt ITI Dhanuvachapuram";
  const bname = batch ? `${batch.trade} ${batch.name}` : "";

  setLoading(true, "Generating link...");
  try {
    // Check if this batch already has a permanent token
    const existingSnap = await getDoc(batchLinkRef(batchId));
    let token;
    if(existingSnap.exists() && existingSnap.data().token){
      token = existingSnap.data().token; // reuse existing token
    } else {
      token = genToken(); // create new token only if none exists
    }

    // Save token + mode for this batch (permanent)
    await setDoc(batchLinkRef(batchId), {
      token, batchId, mode,
      inst, bname, uid: S.user.uid,
      instructorName: S.profile?.name||"",
      created: existingSnap.exists()?existingSnap.data().created:Date.now(),
      updated: Date.now()
    });

    // Push current attendance snapshot to public collection
    await pushParentLinkData(token, batchId, dk, inst, bname, mode);

    // Build the shareable URL
    const baseUrl = window.location.href.split("?")[0].split("#")[0];
    const link = `${baseUrl}?view=${token}`;

    setLoading(false);
    showParentLinkModal(link, token, mode, bname, dk);
  } catch(e) {
    setLoading(false);
    toast("Error generating link: " + e.message, "error");
  }
}

async function pushParentLinkData(token, batchId, dk, inst, bname, mode, uid) {
  const students = S.students.filter(s=>s.batchId===batchId);
  const isP = v => v==="P"||v==="Pe";
  const dateObj = new Date(dk + 'T00:00:00');
  const dowFull = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dateObj.getDay()];
  const [y,m,d] = dk.split('-');
  const dateLabel = `${parseInt(d)} ${MONTHS[parseInt(m)-1]} ${y} (${dowFull})`;

  // Use S.attendance[dk] which is already updated in memory before this call
  // Merge with Firestore to catch any marks from other sessions
  let attSnap = Object.assign({}, S.attendance[dk] || {});
  try {
    const snap = await getDoc(attRef(dk));
    if(snap.exists()){
      // Merge: in-memory wins (it has the latest mark just saved)
      attSnap = Object.assign({}, snap.data(), S.attendance[dk] || {});
    }
    // Update cache
    S.attendance[dk] = attSnap;
  } catch(e) { /* use in-memory */ }

  // Build student list
  const list = students.map(s => {
    const r=attSnap[s.id]||{fn:"",an:""};
    const fp=isP(r.fn), ap=isP(r.an);
    let status, statusCode;
    if(r.fn==="CL"||r.an==="CL"){status="Casual Leave";statusCode="CL";}
    else if(r.fn==="ML"||r.an==="ML"){status="Medical Leave";statusCode="ML";}
    else if((r.fn==="Pe"||r.an==="Pe")&&fp&&ap){status="Permission";statusCode="Pe";}
    else if(fp&&ap){status="Present";statusCode="P";}
    else if(fp&&!ap){status="AN Absent";statusCode="PA";}
    else if(!fp&&ap){status="FN Absent";statusCode="AP";}
    else if(r.fn==="A"||r.an==="A"){status="Absent";statusCode="A";}
    else{status="Not marked";statusCode="";}
    return {name:s.name, adm:s.adm, status, statusCode};
  });

  const stats = {
    present: list.filter(s=>s.statusCode==="P").length,
    absent:  list.filter(s=>s.statusCode==="A").length,
    permission: list.filter(s=>s.statusCode==="Pe").length,
    cl: list.filter(s=>s.statusCode==="CL").length,
    ml: list.filter(s=>s.statusCode==="ML").length,
    halfDay: list.filter(s=>s.statusCode==="PA"||s.statusCode==="AP").length,
    total: students.length
  };

  // Store in public parentlinks collection
  await setDoc(pubLinkRef(token), {
    token, inst, bname, dateLabel, dk,
    uid: S.user?.uid||"",
    batchId, mode, stats, list,
    updatedAt: Date.now(),
    active: true
  });
}

async function refreshParentLinkData(forceDk) {
  // Called after any attendance change - pushes latest data to parent link
  try {
    const {batchId, year, month, day} = S.attState;
    const dk = forceDk || `${year}-${pad(month+1)}-${pad(Math.min(day, daysInMonth(year,month)))}`;
    const snap = await getDoc(batchLinkRef(batchId));
    if(!snap.exists()||!snap.data().token) return;
    const pl = snap.data();
    // Always push regardless of date - parent link shows whatever date instructor is viewing
    await pushParentLinkData(pl.token, batchId, dk, pl.inst, pl.bname, pl.mode);
  } catch(e) { /* silent */ }
}

async function parseFile(file){
  const name = file.name.toLowerCase();
  if(name.endsWith(".csv")){
    return parseCSV(await file.text());
  } else {
    // xlsx/xls — use SheetJS from CDN
    return new Promise((resolve,reject)=>{
      const script = document.getElementById("sheetjs-cdn");
      function readFile(){
        const reader = new FileReader();
        reader.onload = e=>{
          try{
            const wb = XLSX.read(e.target.result,{type:"array"});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
            resolve(parseRows(data));
          }catch(err){reject(err);}
        };
        reader.readAsArrayBuffer(file);
      }
      if(window.XLSX){readFile();}
      else{
        const s = document.createElement("script");
        s.id = "sheetjs-cdn";
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
        s.onload = readFile;
        s.onerror = ()=>reject(new Error("Could not load Excel reader. Try saving as CSV."));
        document.head.appendChild(s);
      }
    });
  }
}

function parseCSV(text){
  // Handle quoted CSV properly
  const lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(l=>l.trim());
  const rows  = lines.map(line=>{
    const cols=[];let cur="",inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(ch===","&&!inQ){cols.push(cur.trim());cur="";}
      else cur+=ch;
    }
    cols.push(cur.trim());
    return cols;
  });
  return parseRows(rows);
}

function parseRows(rows){
  if(!rows.length)throw new Error("File is empty");
  // Detect header row
  let dataStart=0;
  const first=rows[0].map(v=>String(v).toLowerCase());
  if(first.some(v=>v.includes("adm")||v.includes("name")||v.includes("batch"))){
    dataStart=1; // skip header
  }
  const students=[];
  for(let i=dataStart;i<rows.length;i++){
    const row=rows[i];
    const adm   = String(row[0]||"").trim();
    const name  = String(row[1]||"").trim().toUpperCase();
    const batch = String(row[2]||"").trim();
    const phone = String(row[3]||"").trim();
    if(!name||name==="STUDENT NAME (CAPS)")continue; // skip guide row
    if(adm==="2025002"||adm==="2025003")continue;    // skip sample rows
    students.push({adm,name,batchName:batch,parentPhone:phone,_row:i+1});
  }
  if(!students.length)throw new Error("No valid student rows found. Check your file format.");
  return students;
}

  <table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead style="position:sticky;top:0;background:#f8fafc">
      <tr>
        <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)">Row</th>
        <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)">Adm No</th>
        <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)">Name</th>
        <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)">Batch</th>
        <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)">Phone</th>
        <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)">Note</th>
      </tr>
    </thead>
    <tbody>${rows_html}</tbody>
  </table>
  </div>
</div>`;

  if(impBtn){impBtn.disabled=false;impBtn.style.opacity="1";}
}

window.doImport=async function doImport(){
  const rows=window._importRows;
  if(!rows?.length){toast("No data to import","error");return;}
  const defBatchId=document.getElementById("imp-batch")?.value||"";

  // Skip duplicates by adm number
  const toImport=rows.filter(r=>!S.students.some(s=>s.adm&&s.adm===r.adm));
  if(!toImport.length){toast("All rows are duplicates — nothing to import","error");return;}

  setLoading(true,`Importing ${toImport.length} students...`);
  try{
    const wbatch=writeBatch(db);
    const newStus=[];
    toImport.forEach(r=>{
      const id=uid();
      const batchId=r.batchId||defBatchId;
      const obj={id,name:r.name,adm:r.adm,batchId,parentPhone:r.parentPhone||""};
      wbatch.set(studentRef(id),obj);
      newStus.push(obj);
    });
    await wbatch.commit();
    S.students.push(...newStus);
    sortStudents();
    closeModal();
    refreshPage();
    toast(`${toImport.length} students imported successfully`);
  }catch(e){
    console.error("Import error:",e);
    toast(e.message,"error");
  }finally{
    setLoading(false);
  }
}

async function doChangePassword(){
  const curPw = document.getElementById("cur-pw")?.value;
  const newPw = document.getElementById("new-pw")?.value;
  const newPw2= document.getElementById("new-pw2")?.value;
  if(!curPw){toast("Enter your current password","error");return;}
  if(!newPw||newPw.length<6){toast("New password must be at least 6 characters","error");return;}
  if(newPw!==newPw2){toast("New passwords do not match","error");return;}
  setLoading(true,"Updating password...");
  try{
    // Re-authenticate first
    const credential=EmailAuthProvider.credential(S.user.email, curPw);
    await reauthenticateWithCredential(S.user, credential);
    // Update password
    await updatePassword(S.user, newPw);
    toast("Password updated successfully. Please sign in again.");
    setTimeout(()=>signOut(auth),2000);
  }catch(e){
    if(e.code==="auth/wrong-password"||e.code==="auth/invalid-credential")
      toast("Current password is incorrect","error");
    else
      toast(e.message,"error");
  }finally{
    setLoading(false);
  }
}

function sortStudents(){
  if(S.sortBy==="adm"){
    S.students.sort((a,b)=>{
      const na=parseInt(a.adm)||99999, nb=parseInt(b.adm)||99999;
      return na-nb||a.name.localeCompare(b.name);
    });
  } else {
    S.students.sort((a,b)=>a.name.localeCompare(b.name));
  }
}
async function viewParentLink(){
  setLoading(true,"Loading links...");
  try{
    const base=window.location.href.split("?")[0].split("#")[0];
    // Load link for each batch in parallel
    const batchLinks=[];
    await Promise.all(S.batches.map(async b=>{
      try{
        const snap=await getDoc(batchLinkRef(b.id));
        if(snap.exists()&&snap.data().token){
          const pl=snap.data();
          batchLinks.push({
            batchId:b.id,
            bname:`${b.trade} ${b.name}`,
            token:pl.token,
            mode:pl.mode||"absent",
            link:base+"?view="+pl.token,
            created:pl.created
          });
        } else {
          batchLinks.push({batchId:b.id,bname:`${b.trade} ${b.name}`,token:null});
        }
      }catch(e){
        batchLinks.push({batchId:b.id,bname:`${b.trade} ${b.name}`,token:null,err:e.message});
      }
    }));
    // Sort: links first, then no-link
    batchLinks.sort((a,b)=>(!a.token&&b.token)?1:(!b.token&&a.token)?-1:0);
    setLoading(false);

    const rows=batchLinks.map(bl=>{
      if(!bl.token){
        return`<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
          <div style="flex:1">
            <div style="font-weight:600;font-size:13px">${bl.bname}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px">No link generated yet</div>
          </div>
          <span style="font-size:11px;color:var(--text3);font-style:italic">Use &#128279; Parent Link button</span>
        </div>`;
      }
      const created=bl.created?new Date(bl.created).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
      const safeLink=bl.link.replace(/'/g,"\'");
      const safeBname=bl.bname.replace(/'/g,"\'");
      return`<div style="padding:12px 16px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="flex:1">
            <div style="font-weight:600;font-size:13px">${bl.bname}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px">
              ${bl.mode==="absent"?"Absent only":"All students"}
              ${created?" &middot; Since "+created:""}
            </div>
          </div>
          <span style="background:#dcfce7;color:#15803d;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px">&#9679; Active</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <input value="${bl.link}" readonly style="font-size:10px;background:var(--surface2);padding:5px 8px;border:1px solid var(--border);border-radius:6px;flex:1;min-width:0"/>
          <button onclick="navigator.clipboard?.writeText('${safeLink}').then(()=>toast('${safeBname} link copied!'))"
            style="padding:5px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);font-size:12px;cursor:pointer;flex-shrink:0;white-space:nowrap">Copy</button>
          <button onclick="if(navigator.share)navigator.share({title:'${safeBname} Attendance',url:'${safeLink}'});else navigator.clipboard?.writeText('${safeLink}').then(()=>toast('Copied!'))"
            style="padding:5px 10px;border:1px solid #86efac;border-radius:6px;background:#f0fdf4;color:#15803d;font-size:12px;cursor:pointer;flex-shrink:0;white-space:nowrap">&#128228; Share</button>
        </div>
      </div>`;
    }).join("");

    const activeCount=batchLinks.filter(b=>b.token).length;
    showModal(`
<div class="modal-header">
  <h3>&#128279; Parent Links &mdash; All Batches</h3>
  <button class="btn-icon" onclick="closeModal()">&#10005;</button>
</div>
<div class="modal-body" style="padding:0">
  <div style="padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text3);display:flex;justify-content:space-between">
    <span>Each batch has its own permanent link. Share once &mdash; parents bookmark it.</span>
    <span style="font-weight:600;color:var(--primary)">${activeCount}/${batchLinks.length} active</span>
  </div>
  <div style="max-height:60vh;overflow-y:auto">${rows}</div>
</div>
<div class="modal-footer">
  <button class="btn btn-secondary" onclick="closeModal()">Close</button>
</div>`);
  }catch(e){
    setLoading(false);
    toast(e.message,"error");
  }
}

</script>
